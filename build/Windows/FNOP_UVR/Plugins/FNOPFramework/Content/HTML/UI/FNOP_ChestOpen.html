<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Chest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;background:transparent}body{display:grid;place-items:center}.shell{--r:#edf2f7;--r2:#aeb8c6;--r3:#fff;position:relative;isolation:isolate;width:min(1140px,97vw);height:min(790px,95vh);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 36px 28px;border-radius:36px;overflow:hidden;background:radial-gradient(circle at 50% 69%,rgba(255,85,185,.16),transparent 38%),linear-gradient(180deg,rgba(9,7,16,.96),rgba(19,12,28,.99));border:1px solid rgba(255,255,255,.14);box-shadow:0 34px 100px rgba(0,0,0,.58)}.shell:before{content:"";position:absolute;inset:-35%;z-index:-2;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.035),transparent 22%,rgba(255,255,255,.02),transparent 55%);animation:ambient 18s linear infinite}.shell:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.04),transparent 33%);pointer-events:none}.shell.rare{--r:#55b8ff;--r2:#176cff;--r3:#d8f4ff}.shell.epic{--r:#ffe067;--r2:#ff9a24;--r3:#fff4b4}.shell.legendary{--r:#50fbff;--r2:#7287ff;--r3:#fff08b}.kicker{font-size:12px;letter-spacing:.26em;font-weight:950;color:var(--r);text-transform:uppercase;text-shadow:0 0 16px var(--r)}.title{font-size:32px;font-weight:950;margin:6px 0 5px}.hint{font-size:12px;letter-spacing:.07em;color:#d7ccdf;margin-bottom:10px;min-height:18px}.cards{position:relative;width:100%;min-height:315px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:8px 0 14px}.card{position:relative;width:30%;max-width:300px;min-height:267px;padding:18px;border-radius:25px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.042));border:1px solid rgba(255,255,255,.15);box-shadow:0 18px 56px rgba(0,0,0,.36);opacity:0;transform:translateY(44px) scale(.76) rotateX(8deg);transition:.52s cubic-bezier(.16,.92,.22,1.18)}.card.show{opacity:1;transform:none}.card:after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 30px rgba(255,255,255,.035)}.card.coins-card.show{animation:coinGlow 1.15s ease-out}.card.spins-card.show{animation:spinGlow 1.15s ease-out}.card.final-card{border-color:rgba(255,255,255,.25)}.card.final-card.show{box-shadow:0 0 26px var(--r),0 0 70px rgba(255,255,255,.16),0 22px 60px rgba(0,0,0,.42);animation:finalLand .75s cubic-bezier(.16,.9,.15,1.15)}.visual{height:140px;display:grid;place-items:center;margin-bottom:9px;position:relative}.visual img,.visual video{max-width:100%;max-height:100%;object-fit:contain;border-radius:15px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.42))}.token{width:92px;height:92px;display:grid;place-items:center;border-radius:50%;font-size:45px;font-weight:950}.coin{background:radial-gradient(circle at 35% 24%,#fff9bd 0 8%,#ffd64d 22%,#e69b14 64%,#7d4007);border:5px solid #ffe17d;color:#6b3700;box-shadow:0 0 30px rgba(255,199,49,.62)}.spin{border-radius:24px;transform:rotate(45deg);background:linear-gradient(135deg,#f1e8ff,#a980ff 54%,#4e30b6);box-shadow:0 0 30px rgba(158,112,255,.58)}.spin b{transform:rotate(-45deg)}.amount{font-size:39px;font-weight:950;text-shadow:0 3px 12px rgba(0,0,0,.42)}.name{font-size:17px;font-weight:950;line-height:1.1}.desc{font-size:11px;color:#d0c5d8;line-height:1.35;margin-top:7px;max-height:45px;overflow:hidden}.dupe{margin-top:8px;padding:6px 8px;border-radius:10px;background:rgba(255,198,64,.12);color:#ffd86b;font-size:10px;font-weight:900}.chest-wrap{display:grid;place-items:center;margin-top:auto}.chest{width:196px;height:150px;border:0;background:transparent;cursor:pointer;position:relative;filter:drop-shadow(0 16px 28px rgba(0,0,0,.45));transition:.12s transform,.2s filter}.chest:hover{filter:drop-shadow(0 0 20px var(--r)) drop-shadow(0 16px 28px rgba(0,0,0,.45))}.chest:active{transform:scale(.94)}.chest.busy{pointer-events:none;animation:chestPulse .46s ease-in-out infinite alternate}.chest img{width:100%;height:100%;object-fit:contain}.chest-fallback{width:162px;height:107px;border-radius:22px 22px 16px 16px;background:linear-gradient(180deg,#98652f,#432817);border:5px solid #efc875;position:relative}.chest-fallback:after{content:"";position:absolute;left:50%;top:47%;width:29px;height:37px;transform:translate(-50%,-50%);border-radius:6px;background:#ffd76a}.accept{margin-top:10px;min-width:178px;padding:13px 25px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--r),var(--r3));color:#110b18;font-weight:950;font-size:14px;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(12px);transition:.28s;box-shadow:0 0 30px rgba(255,255,255,.08)}.accept.show{opacity:1;pointer-events:auto;transform:none}.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}.p{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--pc,#fff);box-shadow:0 0 10px var(--pc,#fff);pointer-events:none}.p.coinp{background:#ffd558;box-shadow:0 0 10px #ffd558}.p.spinp{border-radius:2px;background:#b993ff;box-shadow:0 0 12px #9b68ff}.charge-core{position:absolute;left:50%;top:47%;width:18px;height:18px;border-radius:50%;opacity:0;pointer-events:none;z-index:19;background:#fff;box-shadow:0 0 16px var(--r),0 0 42px var(--r),0 0 90px var(--r2)}.charging .charge-core{opacity:1;animation:coreCharge 1s ease-in forwards}.burst{position:absolute;left:50%;top:47%;width:18px;height:18px;border:3px solid var(--r);border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:18}.burst.go{animation:burst .72s ease-out forwards}.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,#fff 0,rgba(255,255,255,.8) 3%,var(--r) 8%,transparent 43%);opacity:0;pointer-events:none;z-index:17}.flash.go{animation:flash .65s ease-out}.rarity-label{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.65);font-weight:950;font-size:18px;letter-spacing:.22em;color:var(--r3);text-shadow:0 0 14px var(--r),0 0 36px var(--r2);opacity:0;pointer-events:none;z-index:21}.charging .rarity-label{animation:rarityIn .9s ease both}

/* MASTER 5X CHEST CARD LAYOUT */
.card.final-card{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  overflow:hidden;
}
.card.final-card .visual{
  height:150px;
  min-height:150px;
  margin:0 0 10px 0;
  padding:8px;
  border-radius:18px;
  overflow:hidden;
  background:rgba(255,255,255,.035);
}
.card.final-card .visual img,
.card.final-card .visual video{
  display:block;
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  object-position:center center;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.28));
}
.card.final-card .name{
  margin-top:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card.final-card .desc{
  margin-top:5px;
  max-height:32px;
  overflow:hidden;
  font-size:10px;
  line-height:1.25;
}

@keyframes ambient{to{transform:rotate(360deg)}}@keyframes coinGlow{0%{box-shadow:0 0 0 rgba(255,204,67,0)}35%{box-shadow:0 0 55px rgba(255,204,67,.7)}100%{box-shadow:0 18px 56px rgba(0,0,0,.36)}}@keyframes spinGlow{0%{box-shadow:0 0 0 rgba(156,112,255,0)}35%{box-shadow:0 0 55px rgba(156,112,255,.72)}100%{box-shadow:0 18px 56px rgba(0,0,0,.36)}}@keyframes finalLand{0%{filter:brightness(2.8);transform:scale(1.28)}100%{filter:none;transform:none}}@keyframes chestPulse{to{transform:scale(1.045);filter:drop-shadow(0 0 30px var(--r))}}@keyframes coreCharge{0%{transform:translate(-50%,-50%) scale(.2);opacity:.3}75%{transform:translate(-50%,-50%) scale(2.1);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:1}}@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(27)}}@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}@keyframes rarityIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}45%{opacity:1}100%{opacity:.35;transform:translate(-50%,-50%) scale(1.05)}}
</style></head><body><main class="shell" id="shell" hidden><div class="fx" id="fx"></div><div class="charge-core"></div><div class="burst" id="burst"></div><div class="flash" id="flash"></div><div class="rarity-label" id="rarityLabel"></div><div class="kicker" id="kicker">CHEST</div><div class="title" id="title"></div><div class="hint" id="hint"></div><section class="cards" id="cards"></section><div class="chest-wrap"><button class="chest" id="chest" type="button" aria-label="Reveal"><img id="chestImg" hidden><div class="chest-fallback" id="fallback"></div></button><button class="accept" id="accept" type="button">ACCEPT</button></div></main><script>
(function(){'use strict';var data=null,stage=0,id='',busy=false;var q=function(s){return document.querySelector(s)},shell=q('#shell'),fx=q('#fx');
function action(n,p){if(typeof window.fnopAction==='function')window.fnopAction(n,String(p==null?'':p));}
function addParticle(x,y,c,dx,dy,dur,size,shape){var p=document.createElement('i');p.className='p';p.style.left=x+'px';p.style.top=y+'px';p.style.width=p.style.height=(size||8)+'px';p.style.setProperty('--pc',c);if(shape)p.style.borderRadius=shape;p.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{opacity:1,offset:.13},{transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*520-260)+'deg) scale(.1)',opacity:0}],{duration:dur||760,easing:'cubic-bezier(.16,.8,.2,1)'});fx.appendChild(p);setTimeout(function(){p.remove()},(dur||760)+40)}
function rectCenter(el){var r=el.getBoundingClientRect(),sr=shell.getBoundingClientRect();return{x:r.left+r.width/2-sr.left,y:r.top+r.height/2-sr.top}}
function rewardSpray(kind,amount,el){var c=rectCenter(el),n=kind==='coins'?Math.min(44,Math.max(18,Number(amount)||0)):Math.min(34,Math.max(15,(Number(amount)||1)*8));for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,d=55+Math.random()*190,col=kind==='coins'?(Math.random()>.35?'#ffd65b':'#fff4ad'):(Math.random()>.35?'#aa7dff':'#e8dcff');addParticle(c.x,c.y,col,Math.cos(a)*d,Math.sin(a)*d,650+Math.random()*520,5+Math.random()*8,kind==='spins'?'2px':'50%')}}
function absorb(duration){var r=shell.getBoundingClientRect(),cx=r.width*.5,cy=r.height*.47,colors=[getComputedStyle(shell).getPropertyValue('--r').trim()||'#fff',getComputedStyle(shell).getPropertyValue('--r2').trim()||'#aaa',getComputedStyle(shell).getPropertyValue('--r3').trim()||'#fff'];for(var i=0;i<72;i++){(function(k){setTimeout(function(){var edge=Math.floor(Math.random()*4),x=edge<2?Math.random()*r.width:(edge===2?0:r.width),y=edge>=2?Math.random()*r.height:(edge===0?0:r.height),p=document.createElement('i');p.className='p';p.style.left=x+'px';p.style.top=y+'px';p.style.width=p.style.height=(3+Math.random()*8)+'px';p.style.setProperty('--pc',colors[k%colors.length]);p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:0},{opacity:1,offset:.15},{transform:'translate('+(cx-x)+'px,'+(cy-y)+'px) scale(.05)',opacity:0}],{duration:Math.max(360,duration-(k%9)*22),easing:'cubic-bezier(.2,.65,.18,1)'});fx.appendChild(p);setTimeout(function(){p.remove()},duration+80)},k*8)})(i)}}
function explode(){var r=shell.getBoundingClientRect(),cx=r.width*.5,cy=r.height*.47,colors=[getComputedStyle(shell).getPropertyValue('--r').trim(),getComputedStyle(shell).getPropertyValue('--r2').trim(),getComputedStyle(shell).getPropertyValue('--r3').trim()];q('#burst').classList.remove('go');q('#flash').classList.remove('go');void q('#burst').offsetWidth;q('#burst').classList.add('go');q('#flash').classList.add('go');for(var i=0;i<92;i++){var a=Math.random()*Math.PI*2,d=90+Math.random()*360;addParticle(cx,cy,colors[i%3]||'#fff',Math.cos(a)*d,Math.sin(a)*d,650+Math.random()*650,4+Math.random()*11,i%4===0?'2px':'50%')}}
function visual(card,box){if(card.image){var im=document.createElement('img');im.src=card.image;box.appendChild(im);return}var t=document.createElement('div');t.className='token '+(card.kind==='coins'?'coin':'spin');t.innerHTML=card.kind==='spins'?'<b>✦</b>':'¤';box.appendChild(t)}
function makeCard(card,index){var el=document.createElement('article');el.className='card '+(card.kind==='coins'?'coins-card':card.kind==='spins'?'spins-card':'final-card');var v=document.createElement('div');v.className='visual';if(card.kind==='item'&&card.media){var lower=String(card.media).toLowerCase();if(lower.indexOf('.mp4')>=0||lower.indexOf('.webm')>=0){var vid=document.createElement('video');vid.src=card.media;vid.autoplay=true;vid.loop=true;vid.muted=true;vid.playsInline=true;v.appendChild(vid)}else{var mi=document.createElement('img');mi.src=card.media;v.appendChild(mi)}}else visual(card,v);el.appendChild(v);/* MASTER_5X_ITEM_NO_EMPTY_AMOUNT */if(card.kind!=='item'){var a=document.createElement('div');a.className='amount';a.textContent='+'+String(card.amount||0);el.appendChild(a)}var n=document.createElement('div');n.className='name';n.textContent=card.name||'';el.appendChild(n);if(card.description){var d=document.createElement('div');d.className='desc';d.textContent=card.description;el.appendChild(d)}if(card.duplicate){var du=document.createElement('div');du.className='dupe';du.textContent=(card.duplicateLabel||'DUPLICATE')+' · +'+String(card.duplicateCoins||0);el.appendChild(du)}return el}
function appendReveal(card){var el=makeCard(card,stage);q('#cards').appendChild(el);requestAnimationFrame(function(){el.classList.add('show')});if(card.kind==='coins'||card.kind==='spins')rewardSpray(card.kind,card.amount,el);action('reveal',stage);stage++;if(stage>=3){q('#hint').textContent='';q('#accept').classList.add('show');q('#chest').style.pointerEvents='none';q('#chest').style.opacity='.70'}return el}
function revealNext(){if(!data||stage>=3||busy)return;action('chestClick',stage);var card=data.cards[stage]||{};if(stage<2){appendReveal(card);return}busy=true;q('#chest').classList.add('busy');shell.classList.add('charging');q('#rarityLabel').textContent=String(data.rarity||'').toUpperCase();var charge=card.bigReward?1000:650;if(card.bigReward)action('bigRewardPrep','1');absorb(charge);setTimeout(function(){explode();shell.classList.remove('charging');q('#chest').classList.remove('busy');appendReveal(card);busy=false},charge)}
window.fnopShowChestOpen=function(d){data=d||{};stage=0;busy=false;id=String(data.presentationId||'');shell.hidden=false;shell.className='shell '+String(data.rarity||'common').toLowerCase();shell.style.setProperty('--accent',data.accent||'#ff55b9');q('#title').textContent=data.title||'CHEST';q('#hint').textContent=data.hint||'';q('#cards').textContent='';fx.textContent='';q('#accept').textContent=data.acceptLabel||'ACCEPT';q('#accept').classList.remove('show');q('#chest').classList.remove('busy');q('#chest').style.pointerEvents='auto';q('#chest').style.opacity='1';var im=q('#chestImg'),fb=q('#fallback');if(data.chestImage){im.src=data.chestImage;im.hidden=false;fb.hidden=true}else{im.hidden=true;fb.hidden=false}};
q('#chest').addEventListener('click',revealNext);q('#accept').addEventListener('click',function(){action('accept',id)});window.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!busy){e.preventDefault();stage<3?revealNext():action('accept',id)}});
})();</script></body></html>
