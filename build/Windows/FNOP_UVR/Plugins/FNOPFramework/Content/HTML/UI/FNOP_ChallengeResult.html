<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FNOP Challenge Result</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#eef4f7;font-family:Arial,sans-serif}
*{box-sizing:border-box}.result{position:fixed;inset:0;display:grid;place-items:center;background:transparent;isolation:isolate}.box{position:relative;width:min(780px,92vw);min-height:560px;text-align:center;padding:38px;border-radius:28px;background:linear-gradient(160deg,#0c1522ee,#070b12f5);border:1px solid #ffffff20;box-shadow:0 25px 90px #000b;overflow:hidden}.eyebrow{font-size:12px;letter-spacing:.25em;color:#8fa8bd;font-weight:900}.title-wrap{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);transition:top .72s cubic-bezier(.2,.8,.2,1),transform .72s cubic-bezier(.2,.8,.2,1)}.title{font-size:68px;margin:10px 0 4px;font-weight:1000;color:#76ffc5;text-shadow:0 0 36px #76ffc533}.name{color:#d7e4ef;font-size:18px}.win-sequencing .title-wrap{top:11%;transform:translateY(0)}.wallet{position:absolute;left:0;right:0;top:22px;padding:0 26px;display:flex;justify-content:space-between;gap:10px;opacity:0;transform:translateY(-10px);transition:opacity .45s ease,transform .45s ease;z-index:5}.wallet.show{opacity:1;transform:none}.wallet-chip{min-width:128px;padding:10px 13px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff17;text-align:left;box-shadow:0 9px 26px #0005}.wallet-label{display:block;font-size:9px;letter-spacing:.14em;color:#8fa8bd;font-weight:900}.wallet-value{display:block;margin-top:2px;font-size:22px;font-weight:1000}.stage{position:absolute;left:50%;top:54%;width:min(580px,80%);transform:translate(-50%,-50%) scale(.84);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease}.stage.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.stage.out{opacity:0;transform:translate(-50%,-64%) scale(.88)}.token{position:relative;margin:0 auto 18px;width:150px;height:150px}.coin-main{width:132px;height:132px;margin:9px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff8bf 0 8%,#ffe478 18%,#f2b332 58%,#a9650f 100%);border:6px solid #ffdc68;box-shadow:inset -12px -14px 22px #6d350044,0 18px 50px #0008,0 0 42px #ffcc4550;animation:floatToken .75s ease-in-out infinite alternate}.coin-main:after{content:"";position:absolute;inset:44px;border-radius:50%;border:5px solid #85510e66}.ticket-main{position:absolute;left:20px;top:31px;width:110px;height:88px;border-radius:16px;background:linear-gradient(135deg,#eadcff,#a47fff 55%,#5c3cc8);box-shadow:0 18px 54px #8c65ff55;transform:rotate(-7deg);border:3px solid #ffffff66}.ticket-main:before,.ticket-main:after{content:"";position:absolute;top:34px;width:20px;height:20px;border-radius:50%;background:#0b111c}.ticket-main:before{left:-12px}.ticket-main:after{right:-12px}.ticket-main span{position:absolute;inset:0;display:grid;place-items:center;font-size:43px;transform:rotate(7deg)}.stage-amount{font-size:58px;font-weight:1000;letter-spacing:-.04em}.stage-label{margin-top:3px;font-size:15px;letter-spacing:.16em;color:#afc3d4;font-weight:900}.buttons{position:absolute;left:38px;right:38px;bottom:34px;display:grid;grid-template-columns:1fr 1fr;gap:12px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .55s ease,transform .55s ease}.buttons.show{opacity:1;transform:none;pointer-events:auto}.buttons button{min-height:58px;font-size:16px;font-weight:900;letter-spacing:.05em;color:#f7fbff;background:linear-gradient(180deg,#24364a,#142131);border:1px solid rgba(255,255,255,.24);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.35);cursor:pointer;-webkit-text-fill-color:#f7fbff}.buttons button:hover{background:linear-gradient(180deg,#31506c,#1a3047);border-color:rgba(118,255,197,.65);transform:translateY(-1px)}.buttons button:focus{outline:2px solid #76ffc5;outline-offset:2px}.buttons button:disabled{cursor:default;opacity:.35}.particle{position:fixed;z-index:12;pointer-events:none;left:50%;top:54%;opacity:1;animation:rewardFly .86s cubic-bezier(.2,.8,.2,1) forwards}.particle.coin-p{width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4b5 0 12%,#ffd86a 24%,#d68b16 100%);border:2px solid #ffe28b;box-shadow:0 0 12px #ffc23b88}.particle.spin-p{width:24px;height:18px;border-radius:5px;background:linear-gradient(135deg,#e8ddff,#916cff);border:2px solid #ffffff99;box-shadow:0 0 12px #9b72ff88}.death-copy{display:none}.noise{display:none;position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.16;mix-blend-mode:screen;background-image:repeating-radial-gradient(circle at 17% 31%,rgba(255,255,255,.5) 0 1px,transparent 1px 4px);animation:noise .08s steps(2,end) infinite}
.result.lose-mode{background:#010103;animation:deathReveal 1.8s ease both}.result.lose-mode .box{width:100%;height:100%;max-width:none;padding:0;border:0;border-radius:0;background:radial-gradient(circle at 50% 44%,#14060a 0,#050306 36%,#000 78%);box-shadow:none}.result.lose-mode .title-wrap{top:50%;z-index:2}.result.lose-mode .title{font-size:clamp(64px,12vw,170px);letter-spacing:.08em;color:#e9e7e4;text-shadow:-5px 0 0 rgba(255,0,38,.18),5px 0 0 rgba(0,104,255,.18),0 0 35px rgba(255,255,255,.08);animation:titleGlitch 2.1s steps(1,end) infinite}.result.lose-mode .name{color:#9b8f92;letter-spacing:.32em;text-transform:uppercase}.result.lose-mode .death-copy{display:block;margin-top:22px;font-size:11px;letter-spacing:.3em;color:#7e6c70}.result.lose-mode .noise{display:block}.result.lose-mode .wallet,.result.lose-mode .stage{display:none}.result.lose-mode .buttons{bottom:7vh;width:min(640px,82vw);left:50%;right:auto;transform:translate(-50%,18px);animation:buttonsIn .9s ease 1.9s forwards;pointer-events:auto}.result.lose-mode .buttons.show{transform:translate(-50%,0)}.result.lose-mode .buttons button{background:rgba(8,5,7,.72);border:1px solid rgba(255,255,255,.18);color:#ddd;letter-spacing:.12em}.result.lose-mode .buttons button:disabled{pointer-events:none;opacity:.25}
@keyframes floatToken{to{transform:translateY(-7px) rotate(2deg)}}
@keyframes rewardFly{0%{transform:translate(var(--sx),var(--sy)) scale(1) rotate(0);opacity:1}72%{opacity:1}100%{left:var(--tx);top:var(--ty);transform:scale(.28) rotate(420deg);opacity:.08}}
@keyframes deathReveal{0%{opacity:0;filter:brightness(2.4) contrast(1.9)}28%{opacity:.32}100%{opacity:1;filter:brightness(1) contrast(1.05)}}@keyframes titleGlitch{0%,91%,100%{transform:none}92%{transform:translate(-7px,2px) skewX(4deg)}93%{transform:translate(5px,-2px) skewX(-3deg)}94%{transform:none}}@keyframes noise{0%{transform:translate(0,0) scale(1.05)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}100%{transform:translate(-1%,0)}}@keyframes buttonsIn{to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:620px){.box{min-height:530px;padding:24px}.title{font-size:48px}.wallet{left:0;right:0;top:14px;padding:0 14px;gap:6px}.wallet-chip{min-width:105px;padding:8px 10px}.wallet-value{font-size:18px}.buttons{left:22px;right:22px;grid-template-columns:1fr}.stage-amount{font-size:46px}.result.lose-mode .buttons{bottom:4vh}}
</style>
</head>
<body>
<main class="result" id="result">
  <section class="box" id="box">
    <div class="noise"></div>
    <div class="wallet" id="wallet">
      <div class="wallet-chip" id="coinChip"><span class="wallet-label" id="coinsLabel">MONEDAS</span><span class="wallet-value" id="coinTotal">0</span></div>
      <div class="wallet-chip" id="spinChip"><span class="wallet-label" id="spinsLabel">TIRADAS</span><span class="wallet-value" id="spinTotal">0</span></div>
    </div>
    <div class="title-wrap" id="titleWrap">
      <div class="eyebrow" data-fnop-i18n="challenge.mode">MODO CHALLENGE</div>
      <div class="title" id="title">RESULTADO</div>
      <div class="name" id="name"></div>
      <div class="death-copy" id="deathCopy" data-fnop-i18n="challenge.deathQuiet">EL MUNDO SE QUEDA EN SILENCIO</div>
    </div>
    <div class="stage" id="stage"><div class="token" id="token"></div><div class="stage-amount" id="stageAmount"></div><div class="stage-label" id="stageLabel"></div></div>
    <div class="buttons" id="buttons"><button id="retry" disabled data-fnop-i18n="challenge.retry">REPETIR</button><button id="menu" disabled data-fnop-i18n="challenge.back">VOLVER AL MENÚ</button></div>
  </section>
</main>
<script>
(function(){
'use strict';
const e=s=>document.querySelector(s);let timers=[],generation=0,lastPresentationId='';
function clearTimers(){generation++;timers.forEach(clearTimeout);timers=[];document.querySelectorAll('.particle').forEach(x=>x.remove())}
function later(fn,ms){const g=generation;const id=setTimeout(()=>{const i=timers.indexOf(id);if(i>=0)timers.splice(i,1);if(g===generation)fn()},ms);timers.push(id);return id}
function act(name,payload){if(typeof window.fnopAction==='function')window.fnopAction(name,payload||'')}
function count(el,from,to,duration){from=Math.max(0,Number(from)||0);to=Math.max(0,Number(to)||0);const start=performance.now();function frame(now){const t=Math.min(1,(now-start)/Math.max(1,duration));const ease=1-Math.pow(1-t,3);el.textContent=String(Math.round(from+(to-from)*ease));if(t<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function particles(kind,target){const rect=target.getBoundingClientRect();const tx=(rect.left+rect.width*.5)+'px',ty=(rect.top+rect.height*.5)+'px';for(let i=0;i<18;i++)later(()=>{const p=document.createElement('i');p.className='particle '+(kind==='coins'?'coin-p':'spin-p');p.style.setProperty('--tx',tx);p.style.setProperty('--ty',ty);p.style.setProperty('--sx',((i%6)-2.5)*13+'px');p.style.setProperty('--sy',(Math.floor(i/6)-1)*11+'px');document.body.appendChild(p);later(()=>p.remove(),1050)},i*28)}
function showStage(kind,d,done){const coins=kind==='coins';const amount=Math.max(0,Number(coins?d.coins:d.spins)||0);if(amount<=0){done();return}const stage=e('#stage'),token=e('#token');token.innerHTML=coins?'<div class="coin-main"></div>':'<div class="ticket-main"><span>✦</span></div>';e('#stageAmount').textContent='+'+amount;e('#stageLabel').textContent=coins?d.coinsLabel:d.spinsLabel;stage.className='stage show';const total=coins?e('#coinTotal'):e('#spinTotal');const chip=coins?e('#coinChip'):e('#spinChip');act('result_reward_sfx',coins?'coins':'spins');particles(kind,chip);count(total,coins?d.coinsBefore:d.spinsBefore,coins?d.coinsAfter:d.spinsAfter,930);later(()=>{stage.className='stage out';later(()=>{stage.className='stage';done()},340)},1350)}
function finishWin(d){const host=d?.hostCanDecide!==false;e('#retry').disabled=!host;e('#menu').disabled=!host;e('#buttons').classList.add('show')}
function startWin(d){e('#result').className='result win-mode';e('#box').className='box win';e('#title').textContent=d.title||'VICTORIA';e('#name').textContent=d.name||'';e('#coinsLabel').textContent=d.coinsLabel||'MONEDAS';e('#spinsLabel').textContent=d.spinsLabel||'TIRADAS';e('#coinTotal').textContent=String(Math.max(0,Number(d.coinsBefore)||0));e('#spinTotal').textContent=String(Math.max(0,Number(d.spinsBefore)||0));e('#retry').disabled=true;e('#menu').disabled=true;e('#buttons').className='buttons';e('#wallet').className='wallet';e('#stage').className='stage';later(()=>{e('#box').classList.add('win-sequencing');e('#wallet').classList.add('show')},760);later(()=>showStage('coins',d,()=>showStage('spins',d,()=>finishWin(d))),1120)}
function startLoss(d){e('#result').className='result lose-mode';e('#box').className='box lose';e('#title').textContent=d.title||'HAS PERDIDO';e('#name').textContent=d.name||'';e('#deathCopy').textContent=window.FNOPI18n?.t('challenge.deathQuiet','EL MUNDO SE QUEDA EN SILENCIO')||'EL MUNDO SE QUEDA EN SILENCIO';e('#retry').disabled=true;e('#menu').disabled=true;e('#buttons').className='buttons';later(()=>{const host=d?.hostCanDecide!==false;e('#retry').disabled=!host;e('#menu').disabled=!host;e('#buttons').classList.add('show')},2400)}
window.fnopSetResult=d=>{d=d||{};const id=String(d.presentationId??'');if(id&&id===lastPresentationId)return;lastPresentationId=id;clearTimers();e('#retry').textContent=d.retry||(window.FNOPI18n?.t('challenge.retry','REPETIR')||'REPETIR');e('#menu').textContent=d.menu||(window.FNOPI18n?.t('challenge.back','VOLVER AL MENÚ')||'VOLVER AL MENÚ');if(d.win)startWin(d);else startLoss(d)};
e('#retry').onclick=()=>{if(!e('#retry').disabled)act('retry','')};e('#menu').onclick=()=>{if(!e('#menu').disabled)act('menu','')};
})();
</script>
</body>
</html>
