<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,Arial,sans-serif}.tag{position:absolute;inset:8px 10px;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,rgba(4,24,34,.78),rgba(10,48,58,.62));border:1px solid rgba(122,238,255,.38);box-shadow:0 0 22px rgba(73,224,255,.13),inset 0 0 20px rgba(88,224,255,.06);color:#edffff;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#72edff;box-shadow:0 0 12px #72edff}.name{font-weight:950;font-size:17px;overflow:hidden;text-overflow:ellipsis}.hint{font-size:10px;color:#ffe85e;font-weight:950;letter-spacing:.09em}</style></head><body><div class="tag"><i class="dot"></i><span class="name" id="name"></span><span class="hint" id="hint">E · EDITAR</span></div><script>window.fnopSetSandboxLabel=s=>{document.getElementById('name').textContent=s?.name||'';document.getElementById('hint').textContent=s?.hint||'E · EDITAR'};</script></body></html>
