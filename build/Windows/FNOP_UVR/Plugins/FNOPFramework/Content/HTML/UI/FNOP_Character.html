<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Character</title></head><body>
<div class="fnop-screen char-screen">
  <section class="fnop-panel char-panel await-state">
    <header class="fnop-head"><div class="char-identity"><div id="characterIcon" class="char-avatar fnop-reward-visual" data-fnop-reward-visual="1"></div><div><div class="fnop-kicker" data-fnop-i18n="character.animatronic">ANIMATRÓNICO</div><h1 id="characterName" data-fnop-i18n="character.character">PERSONAJE</h1><div class="char-pointer-hint" id="characterPointerHint" data-fnop-i18n="character.pointer">Clic para interactuar</div></div></div><button class="fnop-close" id="hideBtn" data-fnop-action="hide" data-fnop-payload="">×</button></header>
    <nav id="tabs" class="char-tabs"></nav>
    <div id="moods" class="moods"></div><div id="characterMoodEditor" class="fnop-mood-editor" hidden></div><div id="moodRejection" role="status" hidden></div>
    <div class="char-content"><div class="fnop-section-title char-section-head"><div><div class="fnop-kicker" id="sectionKicker" data-fnop-i18n="character.content">CONTENIDO</div><h2 id="sectionTitle"></h2></div><button class="fnop-btn ghost clothing-corner" id="clothingBtn" data-fnop-action="clothingtoggle" data-fnop-payload="undress" hidden>Desnudarla</button></div><div id="cards" class="char-grid"></div></div>
    <footer class="char-footer"><button class="fnop-btn ghost censor-toggle" id="censorBtn" data-fnop-action="censor" data-fnop-payload="0" data-fnop-i18n="character.censorshipOn">CENSURA: ON</button><button class="fnop-btn ghost" id="backBtn" data-fnop-action="back" data-fnop-payload="" data-fnop-i18n="character.back">ATRÁS</button><button class="fnop-btn" id="followBtn" data-fnop-action="follow" data-fnop-payload="" data-fnop-i18n="character.follow">SEGUIR</button><button class="fnop-btn ghost" id="stayBtn" data-fnop-action="stay" data-fnop-payload="" data-fnop-i18n="character.stay">QUEDARSE</button><button class="fnop-btn danger" id="exitActionBtn" data-fnop-action="exitaction" data-fnop-payload="" data-fnop-i18n="character.exitAction">SALIR DE ACCIÓN</button></footer>
  </section>
</div>
<style>
.char-screen{align-items:center;justify-content:center;padding:28px}.char-panel.await-state{visibility:hidden}.char-panel.await-state .char-tabs,.char-panel.await-state .moods,.char-panel.await-state .char-content,.char-panel.await-state .char-footer{visibility:hidden}.char-panel{width:min(1120px,96vw);height:min(760px,94vh);display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}.char-panel.mood-mode{grid-template-rows:auto auto auto auto;height:auto;max-height:94vh}.fnop-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.char-identity{display:flex;align-items:center;gap:12px}.char-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035);background-size:cover;background-position:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}.fnop-head h1{margin:3px 0 0;font-size:34px}.char-tabs{display:flex;gap:7px;padding:9px 16px;border-bottom:1px solid var(--line);overflow-x:auto}.char-tabs button{white-space:nowrap}.moods{display:none;padding:9px 16px 12px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px}.moods.visible{display:grid}.mood{padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);min-width:0}.mood-top{display:flex;justify-content:space-between;gap:5px;font-size:9px;font-weight:850;letter-spacing:.02em}.mood-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mood-track{height:4px;background:rgba(255,255,255,.08);border-radius:999px;margin-top:5px;overflow:hidden}.mood-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--violet));transition:width .12s var(--ease)}.char-content{padding:15px 18px;overflow:auto}.char-panel.mood-mode .char-content{display:none}.char-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;min-height:46px}.clothing-corner{margin-left:auto;flex:0 0 auto;white-space:nowrap;min-width:126px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.clothing-corner:hover{border-color:var(--line-hot);box-shadow:0 10px 30px rgba(255,79,181,.14)}.clothing-corner.restore{opacity:.88}.clothing-corner[hidden]{display:none}.char-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.char-grid.skin-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.char-grid.skin-grid .char-card{aspect-ratio:auto;min-height:0}.char-grid.skin-grid .char-image{position:relative;inset:auto;width:100%;height:auto;aspect-ratio:1/1;background-size:cover;background-position:center}.char-grid.skin-grid .char-card-body{position:relative;left:auto;right:auto;bottom:auto;z-index:3;padding:11px 12px 12px;background:var(--surface2)}.char-grid.skin-grid .char-card-title,.char-grid.skin-grid .char-card-sub{position:relative;z-index:4}.char-card{position:relative;min-height:190px;border:1px solid var(--line);border-radius:19px;overflow:hidden;background:var(--surface2);cursor:pointer;text-align:left;transition:transform .10s var(--ease),border-color .10s,box-shadow .10s;animation:fnop-card-in .15s both}.char-card:hover{transform:translateY(-5px) scale(1.012);border-color:var(--line-hot);box-shadow:0 18px 44px rgba(255,79,181,.1)}.char-card.disabled{opacity:.36;pointer-events:none}.char-card.blocked-card{border-color:rgba(255,190,70,.5);box-shadow:0 0 0 1px rgba(255,190,70,.10) inset}.char-card.blocked-card .char-card-sub{color:#ffd36a}.char-image{height:118px;background:rgba(255,255,255,.025);background-size:cover;background-position:center}.char-card-body{padding:13px}.char-card-title{font-size:14px;font-weight:850}.char-card-sub{color:var(--muted);font-size:11px;margin-top:4px}.char-footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}.char-footer button[hidden]{display:none}.censor-toggle.active{border-color:rgba(255,79,181,.7);box-shadow:0 0 0 1px rgba(255,79,181,.18) inset}.censor-toggle.off{opacity:.72}.fnop-close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:white;font-size:22px;cursor:pointer;transition:.10s var(--ease)}.fnop-close:hover{transform:rotate(90deg) scale(1.08);border-color:var(--line-hot)}@media(max-width:850px){.char-grid{grid-template-columns:repeat(2,1fr)}.moods{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:5px}.mood{padding:6px}.char-panel{height:96vh}.char-panel.mood-mode{height:auto}.fnop-head{padding:10px 13px}.fnop-head h1{font-size:25px}.char-tabs{padding:6px 9px}.char-footer{padding:7px 9px}}
</style>
<script>
const $=s=>document.querySelector(s); let state={},charLastRenderJson="",charActionSeq=0,charRenderSeq=0,charBoundsSeq=0,charLastBounds=''; function fnopCharacterAction(action,payload=''){const a=String(action||''),p=String(payload??'');if(!a)return false;try{document.title='__FNOP_CHAR_ACTION__'+encodeURIComponent(a)+'|'+encodeURIComponent(p)+':'+Date.now().toString(36)+'-'+(++charActionSeq).toString(36);return true;}catch(_){return false;}}
function reportCharacterBounds(){try{const panel=document.querySelector('.char-panel');if(!panel)return;const r=panel.getBoundingClientRect(),vw=Math.max(1,document.documentElement.clientWidth||window.innerWidth||1),vh=Math.max(1,document.documentElement.clientHeight||window.innerHeight||1);const f=n=>Math.max(0,Math.min(1,n)).toFixed(6),sig=[f(r.left/vw),f(r.top/vh),f(r.width/vw),f(r.height/vh)].join(',');if(sig===charLastBounds)return;charLastBounds=sig;document.title='__FNOP_CHAR_BOUNDS__'+sig+':'+Date.now().toString(36)+'-'+(++charBoundsSeq).toString(36);}catch(_){}}
function queueCharacterBounds(){requestAnimationFrame(()=>requestAnimationFrame(reportCharacterBounds));}
function button(label,action,payload,active=false){const b=document.createElement('button');b.className='fnop-btn ghost'+(active?' active':'');b.textContent=label;b.dataset.fnopAction=String(action||'');b.dataset.fnopPayload=String(payload||'');b.onclick=()=>fnopCharacterAction(action,payload||'');return b}
function render(d){d=d||{};const fingerprint=JSON.stringify(d);if(fingerprint===charLastRenderJson){try{document.title='__FNOP_CHAR_RENDER_ACK__'+Date.now().toString(36)+'-'+(++charRenderSeq).toString(36)}catch(_){}queueCharacterBounds();return;}charLastRenderJson=fingerprint;state=d;const panel=document.querySelector('.char-panel');if(panel)panel.classList.remove('await-state');$('#characterName').textContent=d.name||(window.FNOPI18n?.t('character.character','PERSONAJE')||'PERSONAJE');const avatar=$('#characterIcon');avatar.style.backgroundImage=d.image?`url("${d.image}")`:'';avatar.style.display=d.image?'block':'none';if(d.image&&window.FNOPRewardVisuals)window.FNOPRewardVisuals.decorate(avatar,d.accent||'#ff55b9');
 const tabs=$('#tabs');tabs.innerHTML='';(d.categories||[]).forEach(c=>tabs.appendChild(button(c.label,'category',c.id,c.active)));
 const moods=$('#moods');moods.innerHTML='';const showMood=d.category==='Estados de animo';moods.classList.toggle('visible',showMood&&!d.moodInventory);document.querySelector('.char-panel').classList.toggle('mood-mode',showMood);if(showMood)(d.moods||[]).forEach((m,i)=>{const e=document.createElement('div');e.className='mood mood-liquid-card';const pct=Math.max(0,Math.min(100,(m.value||0)*100));const colors=[['#ff536a','#ff8c78'],['#478cff','#70d4ff'],['#ffd052','#ffef8a'],['#9b62ff','#d09cff'],['#36cbb1','#74f0cf']];const cc=colors[i%colors.length];e.style.setProperty('--liquid',cc[0]);e.style.setProperty('--liquid2',cc[1]);e.innerHTML=`<div class="mood-top"><span>${m.name}</span><span>${m.raw!=null?Math.round(m.raw):Math.round(pct)}</span></div><div class="mood-vessel"><div class="mood-liquid" style="height:${pct}%"><i class="mood-wave"></i><i class="mood-bubble b1"></i><i class="mood-bubble b2"></i><i class="mood-bubble b3"></i></div></div>`;moods.appendChild(e)});
 const me=$('#characterMoodEditor');me.hidden=!showMood;if(showMood&&window.FNOPMoodUI)window.FNOPMoodUI.mount(me,d.moodInventory||{},p=>fnopCharacterAction('moodtransfer',JSON.stringify(p)));const rejection=$('#moodRejection');rejection.textContent=d.rejection||'';rejection.hidden=!d.rejection;$('#sectionKicker').textContent=d.kicker||(window.FNOPI18n?.t('character.content','CONTENIDO')||'CONTENIDO');$('#sectionTitle').textContent=d.title||''; const cards=$('#cards');cards.innerHTML='';cards.classList.toggle('skin-grid',d.category==='Skins');(d.cards||[]).forEach((c,i)=>{const e=document.createElement('button');e.className='char-card'+(c.enabled===false?' disabled':'')+(c.blocked?' blocked-card':'');e.style.animationDelay=(i*.012)+'s';e.dataset.fnopAction=String(c.action||'interaction');e.dataset.fnopPayload=String(c.payload||c.id||'');e.onclick=()=>fnopCharacterAction(c.action||'interaction',c.payload||c.id||'');if(c.blockedReason)e.title=String(c.blockedReason);const img=c.image?`style="background-image:url('${c.image}')"`:'';const sub=c.blockedReason||c.subtitle||'';e.innerHTML=`<div class="char-image fnop-reward-visual" data-fnop-reward-visual="1" data-fnop-accent="${c.accent||'#ff55b9'}" ${img}></div><div class="char-card-body"><div class="char-card-title">${c.name||c.id||''}</div><div class="char-card-sub">${sub}</div></div>`;if(window.FNOPRewardVisuals)window.FNOPRewardVisuals.decorate(e.querySelector('.char-image'),c.accent||'#ff55b9');if(typeof c.acceptance==='number'){const chance=document.createElement('div');chance.className='mood-chance';chance.textContent=Math.round(c.acceptance*100)+'%';chance.title=c.moodHint||'';e.querySelector('.char-card-body').appendChild(chance)}cards.appendChild(e)});
 $('#backBtn').hidden=!d.canBack;$('#exitActionBtn').hidden=!d.canExitAction;$('#followBtn').hidden=d.showMovement===false;$('#stayBtn').hidden=d.showMovement===false;
 const clothing=$('#clothingBtn');if(clothing){const hidden=!!d.clothingHidden,show=d.category==='Acciones'&&d.clothingAvailable===true;clothing.hidden=!show;if(show){const fallback=window.FNOPI18n?.t(hidden?'character.dress':'character.undress',hidden?'Vestirla':'Desnudarla')||(hidden?'Vestirla':'Desnudarla');const fallbackHint=window.FNOPI18n?.t(hidden?'character.dressHint':'character.undressHint',hidden?'Restaurar la ropa del personaje.':'Pedir permiso para quitar la ropa del personaje.')||(hidden?'Restaurar la ropa del personaje.':'Pedir permiso para quitar la ropa del personaje.');clothing.textContent=d.clothingLabel||fallback;clothing.title=d.clothingHint||fallbackHint;clothing.setAttribute('aria-label',clothing.textContent);clothing.dataset.fnopPayload=hidden?'dress':'undress';clothing.disabled=d.clothingEnabled===false;clothing.classList.toggle('restore',hidden);}}
 const cb=$('#censorBtn');if(cb){cb.hidden=d.censorshipAvailable===false;cb.textContent=window.FNOPI18n?.t(d.censorshipEnabled?'character.censorshipOn':'character.censorshipOff',d.censorshipEnabled?'CENSURA: ON':'CENSURA: OFF')||(d.censorshipEnabled?'CENSURA: ON':'CENSURA: OFF');cb.classList.toggle('active',!!d.censorshipEnabled);cb.classList.toggle('off',!d.censorshipEnabled);cb.dataset.fnopPayload=d.censorshipEnabled?'0':'1';}
 try{document.title='__FNOP_CHAR_RENDER_ACK__'+Date.now().toString(36)+'-'+(++charRenderSeq).toString(36)}catch(_){} queueCharacterBounds();
}
$('#hideBtn').onclick=()=>fnopCharacterAction('hide','');$('#backBtn').onclick=()=>fnopCharacterAction('back','');$('#followBtn').onclick=()=>fnopCharacterAction('follow','');$('#stayBtn').onclick=()=>fnopCharacterAction('stay','');$('#exitActionBtn').onclick=()=>fnopCharacterAction('exitaction','');$('#clothingBtn').onclick=()=>fnopCharacterAction('clothingtoggle',state.clothingHidden?'dress':'undress');$('#censorBtn').onclick=()=>fnopCharacterAction('censor',state.censorshipEnabled?'0':'1');window.fnopSetCharacter=render;window.addEventListener('resize',queueCharacterBounds);try{const panel=document.querySelector('.char-panel');if(panel&&window.ResizeObserver)new ResizeObserver(queueCharacterBounds).observe(panel)}catch(_){}if(window.__FNOP_CHARACTER_PENDING_STATE__)render(window.__FNOP_CHARACTER_PENDING_STATE__);try{document.title='__FNOP_CHAR_READY__'+Date.now().toString(36)}catch(_){}queueCharacterBounds();
</script></body></html>
