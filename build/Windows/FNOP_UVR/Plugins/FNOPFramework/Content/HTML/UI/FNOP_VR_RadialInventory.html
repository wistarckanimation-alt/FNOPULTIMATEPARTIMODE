<!doctype html><html><head><meta charset="utf-8"><style>
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}.root{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.ring{position:relative;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at center,rgba(8,11,18,.35) 0 24%,rgba(6,10,18,.88) 25% 68%,rgba(6,10,18,.18) 69%);box-shadow:0 0 55px rgba(0,0,0,.65),inset 0 0 65px rgba(80,190,255,.12);border:2px solid rgba(125,220,255,.32)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(5,8,15,.82);border:2px solid rgba(255,255,255,.14);font-weight:800;font-size:26px;letter-spacing:.02em}.slot{position:absolute;width:190px;min-height:90px;padding:12px 16px;box-sizing:border-box;border-radius:18px;background:rgba(10,16,28,.92);border:2px solid rgba(130,170,210,.35);box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .08s,border-color .08s,box-shadow .08s}.slot.on{transform:translate(-50%,-50%) scale(1.12)!important;border-color:#ffe66b;box-shadow:0 0 30px rgba(255,230,107,.72),0 10px 34px rgba(0,0,0,.5);background:rgba(30,28,15,.96)}.name{font-size:22px;font-weight:800;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:16px;opacity:.75;margin-top:4px}.empty{font-size:24px;font-weight:700;opacity:.7}.hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:18px;opacity:.75}</style></head><body><div class="root"><div class="ring" id="ring"><div class="center" id="center">INVENTARIO</div><div class="hint" id="hint">Apunta con la mano derecha · Suelta B para equipar</div></div></div><script>
const dict={es:['INVENTARIO','Apunta con la mano derecha · Suelta B para equipar','VACÍO'],en:['INVENTORY','Aim with your right hand · Release B to equip','EMPTY'],fr:['INVENTAIRE','Pointez avec la main droite · Relâchez B pour équiper','VIDE'],de:['INVENTAR','Mit rechter Hand zielen · B loslassen zum Ausrüsten','LEER'],it:['INVENTARIO','Punta con la mano destra · Rilascia B per equipaggiare','VUOTO'],pt:['INVENTÁRIO','Aponte com a mão direita · Solte B para equipar','VAZIO'],ja:['インベントリ','右手で狙い、Bを離して装備','空'],ko:['인벤토리','오른손으로 가리키고 B를 놓아 장착','비어 있음'],ru:['ИНВЕНТАРЬ','Укажите правой рукой · Отпустите B','ПУСТО'],pl:['EKWIPUNEK','Wskaż prawą ręką · Puść B, aby wybrać','PUSTO'],zhHans:['物品栏','用右手指向 · 松开 B 装备','空'],zhHant:['物品欄','用右手指向 · 放開 B 裝備','空']};let lang=(navigator.language||'es').toLowerCase(),t=lang.startsWith('en')?dict.en:lang.startsWith('fr')?dict.fr:lang.startsWith('de')?dict.de:lang.startsWith('it')?dict.it:lang.startsWith('pt')?dict.pt:lang.startsWith('ja')?dict.ja:lang.startsWith('ko')?dict.ko:lang.startsWith('ru')?dict.ru:lang.startsWith('pl')?dict.pl:(lang.startsWith('zh-hant')||lang.startsWith('zh-tw')||lang.startsWith('zh-hk'))?dict.zhHant:lang.startsWith('zh')?dict.zhHans:dict.es;center.textContent=t[0];hint.textContent=t[1];
window.fnopSetRadial=function(s){document.querySelectorAll('.slot,.empty').forEach(x=>x.remove());const a=s.items||[];if(!a.length){const e=document.createElement('div');e.className='empty';e.textContent=t[2];e.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin-top:130px';ring.appendChild(e);return;}const cx=380,cy=380,r=270; a.forEach((it,i)=>{const ang=-Math.PI/2+(Math.PI*2*i/a.length),x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;const d=document.createElement('div');d.className='slot'+(i===s.hover?' on':'');d.style.left=x+'px';d.style.top=y+'px';d.style.transform='translate(-50%,-50%)';d.innerHTML='<div class="name"></div><div class="count"></div>';d.querySelector('.name').textContent=it.name||it.id;d.querySelector('.count').textContent='× '+(it.count||1);ring.appendChild(d);});};
