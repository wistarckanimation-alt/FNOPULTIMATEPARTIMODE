<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Poses</title>
<style>
:root{--accent:#b9ff72;--accent2:#62e8d7}.pose-panel{width:min(560px,94vw);height:min(720px,94vh);display:grid;grid-template-rows:auto 1fr auto}.pose-list{padding:16px;display:grid;gap:9px;align-content:start}.pose{min-height:58px;justify-content:space-between;text-transform:uppercase;font-weight:850;letter-spacing:.1em}.pose::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.55}.pose span{flex:1;text-align:left}.stop{margin:0 16px 16px}
</style></head><body><main class="fnop-screen"><section class="fnop-panel pose-panel"><header class="fnop-head"><div><div class="fnop-kicker" data-fnop-i18n="pose.session">SESIÓN DE POSES</div><h1 class="fnop-title" data-fnop-i18n="pose.variants">VARIANTES</h1></div></header><div class="fnop-scroll"><div class="pose-list" id="poses"></div></div><button class="fnop-btn danger stop" id="stop" data-fnop-i18n="pose.stop">DETENER POSE</button></section></main><script>window.fnopSetPoses=d=>{d=d||{};var note=document.getElementById('poseRejection');if(!note){note=document.createElement('p');note.id='poseRejection';note.setAttribute('role','status');document.querySelector('.pose-panel').appendChild(note);}note.textContent=d.rejection||'';const r=document.getElementById('poses');r.innerHTML='';(d?.poses||[]).forEach((p,i)=>{const b=document.createElement('button');b.className='fnop-btn pose';b.style.animation=`fnopCardIn .14s ${i*.012}s var(--ease) both`;const s=document.createElement('span');s.textContent=p.name||p.id;b.appendChild(s);if(p.acceptance!=null){var odds=document.createElement('small');odds.textContent=Math.round(Number(p.acceptance)*100)+'%';odds.title=p.hint||'';b.appendChild(odds);}b.insertAdjacentHTML('beforeend','');b.onclick=()=>window.fnopAction?.('pose',p.id);r.appendChild(b)})};document.getElementById('stop').onclick=()=>window.fnopAction?.('stop','');</script></body></html>
