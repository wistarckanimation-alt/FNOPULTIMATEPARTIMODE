90deg,#ffe889,#ffb44a,#ff7a36);transition:width .06s linear;box-shadow:0 0 18px rgba(255,180,74,.35)}.flash-delay{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:14px;background:rgba(18,10,7,.92);border:1px solid rgba(255,157,82,.4);font-size:11px;font-weight:1000;color:#ffd9ae;opacity:0;transition:.15s}.flash-delay.show{opacity:1}.flash-count{font-size:17px;color:#fff;margin-left:7px}@keyframes fnopShake{from{transform:translate(-10px,-3px) rotate(-12deg)}to{transform:translate(10px,3px) rotate(12deg)}}
.hide-exit{pointer-events:auto;position:absolute;left:50%;bottom:154px;transform:translate(-50%,10px);display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(7,9,14,.88);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:10px;font-weight:900;letter-spacing:.10em;opacity:0;transition:opacity .16s,transform .18s}.hide-exit.show{opacity:1;transform:translate(-50%,0)}.hide-exit .key{display:grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);font-size:9px}
</style></head><body><div class="hud"><div class="economy" id="economy"><div class="resource"><img id="coinImg"><i class="fallback" id="coinFallback"></i><span id="coins">0</span></div><div class="resource spins"><img id="spinImg"><i class="fallback" id="spinFallback"></i><span id="spins">0</span></div></div><div class="editor-quick" id="editorQuick"><span class="editor-quick-key" id="editorQuickKey">F6</span><span class="editor-quick-copy"><strong id="editorQuickText">EDITOR MODO LIBRE</strong><small id="editorQuickHint">ABRIR EDITOR</small></span></div><div class="cross" id="cross"><img id="crossImg"><div class="cross-lines" id="crossLines"><i class="l"></i><i class="r"></i><i class="t"></i><i class="b"></i></div></div><div class="hint" id="hint"><span class="hint-icon" id="hintIcon"></span><span class="hint-key" id="hintKey"></span><span class="hint-text" id="hintText"></span></div><div class="hands" id="hands"></div><div class="sandbox-bar" id="sandboxBar"><div class="sandbox-caption" id="sandboxCaption">OBJETOS DESBLOQUEADOS</div><div class="sandbox-track" id="sandboxTrack"></div><div class="sandbox-name" id="sandboxName"></div><div class="sandbox-help" id="sandboxHelp">RUEDA: CAMBIAR · CLICK: COLOCAR · E: PREVISUALIZAR</div></div><div class="editor-coach" id="editorCoach"><div class="coach-head"><div><div class="coach-kicker" id="coachTitle"></div><div class="coach-state" id="coachState"></div></div><div class="coach-step" id="coachStep"></div></div><div class="coach-list" id="coachList"></div></div><div class="stamina" id="stamina"><div class="stamina-label" id="staminaLabel">ESTAMINA</div><div class="stamina-track"><div class="stamina-fill" id="staminaFill"></div></div></div><div class="gameplay-inv" id="gameplayInv"><div class="gameplay-kicker" id="gameplayInvLabel">INVENTARIO</div><div class="gameplay-slots" id="gameplaySlots"></div><div class="gameplay-selected"><div class="gameplay-name" id="gameplayInvName">VACIO</div><div class="gameplay-qty" id="gamep <script>
const setImg=(img,fallback,src)=>{img.style.display=src?'block':'none';fallback.style.display=src?'none':'block';if(src)img.src=src};
function renderSandboxBar(d){const bar=document.getElementById('sandboxBar'),track=document.getElementById('sandboxTrack'),items=Array.isArray(d.sandboxItems)?d.sandboxItems:[];bar.classList.toggle('show',!!d.showSandboxObjectBar&&items.length>0);bar.classList.toggle('locked',!!d.sandboxObjectLocked);document.getElementById('sandboxCaption').textContent=d.sandboxCatalogTitle||'OBJETOS DESBLOQUEADOS';document.getElementById('sandboxHelp').textContent=d.sandboxCatalogHelp||'';if(!items.length){track.innerHTML='';document.getElementById('sandboxName').textContent='';return}let selected=items.findIndex(x=>x.id===d.sandboxSelectedId);if(selected<0)selected=0;document.getElementById('sandboxName').textContent=items[selected].name||'';track.innerHTML='';const offsets=[-2,-1,0,1],positions=[-112,-56,0,56];offsets.forEach((off,i)=>{let idx=(selected+off)%items.length;if(idx<0)idx+=items.length;const it=items[idx],slot=document.createElement('div');slot.className='sandbox-slot'+(off===0?' selected':'');slot.style.transform=`translateX(${positions[i]}px) scale(${off===0?1:Math.abs(off)===1?.92:.82})`;slot.style.opacity=off===0?'1':Math.abs(off)===1?'.78':'.48';slot.title=it.name||'';if(it.image){const img=document.createElement('img');img.src=it.image;slot.appendChild(img)}else{const f=document.createElement('span');f.className='fallback';f.textContent=(it.name||'?').trim().slice(0,2).toUpperCase();slot.appendChild(f)}track.appendChild(slot)});}

let lastCoachSignature='';
function renderEditorCoach(d){const c=document.getElementById('editorCoach'),list=document.getElementById('coachList'),items=Array.isArray(d.editorCoachItems)?d.editorCoachItems:[];const show=!!d.showEditorCoach;c.classList.toggle('show',show);c.classList.toggle('alert',d.editorCoachTone==='danger');document.getElementById('coachTitle').textContent=d.editorCoachTitle||'';document.getElementById('coachState').textContent=d.editorCoachState||'';document.getElementById('coachStep').textContent=d.editorCoachStep||'';const sig=JSON.stringify(items)+'|'+(d.editorCoachState||'');if(sig!==lastCoachSignature){lastCoachSignature=sig;list.innerHTML='';items.forEach((it,i)=>{const row=document.createElement('div');row.className='coach-row';row.style.animationDelay=(i*28)+'ms';const key=document.createElement('span');key.className='coach-key';key.textContent=it.key||'';const txt=document.createElement('span');txt.className='coach-text';txt.textContent=it.text||'';row.appendChild(key);row.appendChild(txt);list.appendChild(row)})}document.getElementById('dev').style.display=show?'none':'block'}
function renderGameplay(d){const inv=document.getElementById('gameplayInv'),st=document.getElementById('stamina');inv.classList.toggle('show',!!d.showGameplayInventory);st.classList.toggle('show',!!d.showStamina);document.getElementById('gameplayInvLabel').textContent=d.gameplayInventoryLabel||'';document.getElementById('gameplayInvName').textContent=d.gameplaySelectedName||'';document.getElementById('gameplayInvQty').textContent=(d.gameplaySelectedQty||0)>0?'×'+d.gameplaySelectedQty:'';document.getElementById('gameplayInvHelp').textContent=d.gameplayWheelHint||'';const slots=document.getElementById('gameplaySlots'),arr=Array.isArray(d.gameplaySlots)?d.gameplaySlots:[];const sig=arr.map(x=>[x.id,x.qty,x.selected,x.image]).join('|');if(slots.dataset.sig!==sig){slots.dataset.sig=sig;slots.innerHTML='';arr.slice(0,5).forEach((it,i)=>{const el=document.createElement('div');el.className='gameplay-slot'+(it.selected?' selected':'');el.title=it.name||it.id||'';const idx=document.createElement('span');idx.className='gameplay-slot-index';idx.textContent=String(i+1);el.appendChild(idx);if(it.image){const im=document.createElement('img');im.src=it.image;el.appendChild(im)}else{const fb=document.createElement('span');fb.className='fallback';fb.textContent=(it.name||it.id||'?').trim().slice(0,2).toUpperCase();el.appendChild(fb)}if(Number(it.qty)>1){const q=document.createElement('span');q.className='gameplay-slot-qty';q.textContent='×'+it.qty;el.appendChild(q)}slots.appendChild(el)})}document.getElementById('staminaLabel').textContent=d.staminaLabel||'';document.getElementById('staminaFill').style.width=(Math.max(0,Math.min(1,Number(d.stamina)||0))*100)+'%';const fh=document.getElementById('flashHeat'),fs=document.getElementById('flashShake'),fd=document.getElementById('flashDelay'),fc=document.getElementById('flashCool');const heat=Math.max(0,Math.min(1,Number(d.flashlightHeat)||0));fh.classList.toggle('show',!!d.showFlashlightHeat);document.getElementById('flashHeatLabel').textContent=d.flashlightHeatLabel||'';document.getElementById('flashFill').style.width=(heat*100)+'%';document.getElementById('flashState').textContent=d.flashlightShaking?(d.flashlightStateCooling||'ENFRIANDO'):(d.flashlightOverheated?(d.flashlightStateBlocked||'BLOQUEADA'):(d.flashlightOn?(d.flashlightStateOn||'ENCENDIDA'):(d.flashlightStateOff||'APAGADA')));fc.classList.toggle('show',!!d.showFlashlightHeat&&!d.flashlightShaking&&(heat>.07||d.flashlightOverheated));document.getElementById('flashCoolKey').textContent=d.flashlightCoolKey||'R';document.getElementById('flashCoolText').textContent=d.flashlightCoolText||'';fs.classList.toggle('show',!!d.flashlightShaking);document.getElementById('flashShakeText').textContent=d.flashlightShakeText||'';document.getElementById('flashShakeFill').style.width=(Math.max(0,Math.min(1,Number(d.flashlightShakeProgress)||0))*100)+'%';fd.classList.toggle('show',!!d.flashlightDelay);document.getElementById('flashDelayText').textContent=d.flashlightDelayText||'';document.getElementById('flashDelayCount').textContent=Math.max(1,Math.ceil(Number(d.flashlightDelaySeconds)||0));}
window.fnopSetHud=d=>{if(!d)return;const econ=document.getElementById('economy');econ.style.display=d.showEconomy?'flex':'none';document.getElementById('coins').textContent=d.coins??0;document.getElementById('spins').textContent=d.spins??0;setImg(document.getElementById('coinImg'),document.getElementById('coinFallback'),d.coinImage||'');setImg(document.getElementById('spinImg'),document.getElementById('spinFallback'),d.spinImage||'');const quick=document.getElementById('editorQuick');document.getElementById('editorQuickKey').textContent=d.freeModeEditorKey||'F6';document.getElementById('editorQuickText').textContent=d.freeModeEditorText||'EDITOR MODO LIBRE';document.getElementById('editorQuickHint').textContent=d.freeModeEditorHint||'';quick.classList.toggle('show',!!d.showFreeModeEditorQuick);quick.classList.toggle('locked',!!d.freeModeEditorLocked);renderSandboxBar(d);renderEditorCoach(d);renderGameplay(d);const cross=document.getElementById('cross');cross.style.display=d.desktop?'block':'none';cross.style.setProperty('--size',Math.max(3,Math.min(8,(d.crossSize||26)*0.20))+'px');cross.style.setProperty('--cross',d.crossColor||'#fff');cross.classList.toggle('interactive',!!d.interactive);const ci=document.getElementById('crossImg'),cl=document.getElementById('crossLines');ci.style.display=d.crossImage?'block':'none';cl.style.display=d.crossImage?'none':'block';if(d.crossImage)ci.src=d.crossImage;const hint=document.getElementById('hint');document.getElementById('hintIcon').textContent=d.hintIcon||'';document.getElementById('hintKey').textContent=d.hintKey||'';document.getElementById('hintText').textContent=d.hint||'';hint.classList.toggle('show',!!d.hint);const hx=document.getElementById('hideExit');document.getElementById('hideExitKey').textContent=d.hideExitKey||'E';document.getElementById('hideExitText').textContent=d.hideExitText||'ESCONDERSE / SALIR';hx.classList.toggle('show',!!d.hiding);document.getElementById('dev').textContent=d.dev||'';document.getElementById('hands').textContent=d.hands||'';};
