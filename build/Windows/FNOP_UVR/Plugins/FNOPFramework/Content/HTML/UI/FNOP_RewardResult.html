<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Reward</title>
<style>
html,body{pointer-events:none}:root{--accent:#ffcf63;--accent2:#ff5fb4}.fnop-screen::before{background:radial-gradient(circle at 50% 50%,rgba(255,95,180,.13),transparent 35%),rgba(4,3,8,.10)}.reward{width:min(760px,88vw);text-align:center;padding:34px;border-radius:34px}.reward h1{font-size:clamp(35px,6vw,68px);margin:4px 0 20px;letter-spacing:-.055em;color:var(--reward-color,#fff)}.reward-img{width:min(410px,70vw);height:min(410px,52vh);margin:auto;padding:18px;border-radius:30px;border:1px solid rgba(255,255,255,.1);background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.015));animation:rewardFloat .18s ease-out 1}.reward p{font-size:20px;margin:20px 0 0;color:#f3eaf3;line-height:1.35}@keyframes rewardFloat{50%{transform:translateY(-7px) scale(1.015)}}
</style></head><body><main class="fnop-screen"><section class="fnop-panel reward"><div class="fnop-kicker">RECOMPENSA CONSEGUIDA</div><h1 id="title"></h1><div class="reward-img fnop-reward-visual" id="imageWrap" data-fnop-reward-visual="1"><img class="fnop-img" id="image"></div><p id="detail"></p></section></main><script>window.fnopSetReward=d=>{if(!d)return;document.getElementById('title').textContent=d.title||'';document.getElementById('detail').textContent=d.detail||'';document.documentElement.style.setProperty('--reward-color',d.color||'#fff');const i=document.getElementById('image');i.src=d.image||'';document.getElementById('imageWrap').style.display=d.image?'block':'none';if(window.FNOPRewardVisuals)window.FNOPRewardVisuals.decorate(document.getElementById('imageWrap'),d.color||'#fff')};</script></body></html>
