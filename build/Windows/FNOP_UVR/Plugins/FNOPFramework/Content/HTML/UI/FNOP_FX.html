<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Effects</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;pointer-events:none!important}*{pointer-events:none!important}canvas{position:absolute;inset:0;width:100%;height:100%}.veil{position:absolute;inset:0;opacity:0;transition:opacity .65s ease;contain:strict}.vhs{background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(37,15,47,.16) 4px);box-shadow:inset 0 0 140px rgba(20,10,29,.25)}.vhs:after{content:"";position:absolute;left:0;right:0;height:12%;background:linear-gradient(transparent,rgba(205,187,220,.05),transparent);animation:tape 7s linear infinite}.focus{box-shadow:inset 0 0 190px rgba(11,6,23,.5)}.success{box-shadow:inset 0 -65px 150px rgba(158,227,207,.3)}.failure{box-shadow:inset 0 0 160px rgba(212,68,120,.3)}.hard{box-shadow:inset 0 0 130px rgba(242,120,89,.3)}
.terror{overflow:hidden;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,rgba(0,0,0,.025) 1px 3px,transparent 3px 6px),radial-gradient(circle at 50% 48%,rgba(105,0,17,.025) 0 28%,rgba(68,0,16,.20) 62%,rgba(0,0,0,.82) 100%);will-change:transform,opacity;transform:translateZ(0);animation:terrorJolt .16s steps(2,end) infinite}
.terror:before,.terror:after{content:"";position:absolute;inset:-8%;opacity:.58;will-change:transform,opacity;transform:translateZ(0);animation:terrorBands .34s steps(2,end) infinite}
.terror:before{background:repeating-linear-gradient(90deg,rgba(255,0,35,.14) 0 3px,transparent 3px 14px),linear-gradient(0deg,transparent 0 22%,rgba(255,255,255,.08) 23% 25%,transparent 26% 66%,rgba(255,0,28,.09) 67% 71%,transparent 72%)}
.terror:after{background:repeating-linear-gradient(90deg,rgba(0,120,255,.13) 0 3px,transparent 3px 15px),repeating-linear-gradient(0deg,transparent 0 42px,rgba(255,255,255,.035) 43px 46px,transparent 47px 88px)}
.terror.paused,.terror.paused:before,.terror.paused:after{animation-play-state:paused!important}
@keyframes terrorJolt{0%{transform:translate3d(0,0,0) scale(1.002)}25%{transform:translate3d(-3px,1px,0) scale(1.005)}50%{transform:translate3d(3px,-2px,0) scale(1.006)}75%{transform:translate3d(-2px,-2px,0) scale(1.004)}100%{transform:translate3d(2px,1px,0) scale(1.003)}}
@keyframes terrorBands{0%{transform:translate3d(-9px,-3%,0);opacity:.50}33%{transform:translate3d(7px,14%,0);opacity:.65}66%{transform:translate3d(-6px,-9%,0);opacity:.42}100%{transform:translate3d(5px,6%,0);opacity:.58}}
@keyframes tape{from{top:-12%}to{top:100%}}@media(prefers-reduced-motion:reduce){.vhs:after{animation:none;display:none}}
</style></head><body data-fnop-no-polish="true"><div id="veils"></div><canvas id="particles"></canvas><script>
(function(){'use strict';
var canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),effects={},parts=[],width=1,height=1,last=0,raf=0,vr=false;
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){width=Math.max(1,innerWidth);height=Math.max(1,innerHeight);var ratio=Math.min(1.5,devicePixelRatio||1);canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);}addEventListener('resize',resize);resize();
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function start(){if(!raf)raf=requestAnimationFrame(frame);}function needsCanvas(){if(parts.length)return true;return Object.keys(effects).some(function(id){var k=effects[id].kind;return ['hearts','broken','coins','confetti','sparks','success'].indexOf(k)>=0;});}
function drop(id){var e=effects[id];if(e&&e.node)e.node.remove();delete effects[id];parts=parts.filter(function(p){return p.id!==id;});}
window.fnopSetEffects=function(s){vr=!!s.vr;var keep={};(s.effects||[]).slice(0,8).forEach(function(d){var id=String(d.id);keep[id]=true;var e=effects[id];if(!e||e.sequence!==d.sequence){drop(id);e=effects[id]={sequence:d.sequence,kind:d.kind,node:null,time:0,lastEmit:-1,stopping:false};if(['vhs','focus','success','failure','hard','terror'].indexOf(d.kind)>=0){e.node=document.createElement('div');e.node.className='veil '+d.kind;document.getElementById('veils').appendChild(e.node);void e.node.offsetWidth;}}
var now=performance.now()/1000;e.intensity=clamp(Number(d.intensity)||0,0,1);e.fadeIn=Math.max(0,Number(d.fadeIn)||0);e.fadeOut=Math.max(0,Number(d.fadeOut)||0);e.start=now-Math.max(0,Number(d.age)||0);if(d.stopping&&!e.stopping){e.stop=now;e.stopAlpha=opacity(e,now);}e.stopping=!!d.stopping;
if(e.node){e.node.style.transitionDuration=(e.stopping?e.fadeOut:e.fadeIn)+'s';e.node.style.opacity=e.stopping?'0':String(e.intensity);if(e.kind==='terror')e.node.classList.toggle('paused',e.stopping||e.intensity<=.005);} });Object.keys(effects).forEach(function(id){if(!keep[id])drop(id);});var needCanvas=needsCanvas();canvas.style.display=needCanvas?'block':'none';if(needCanvas)start();};
function opacity(e,now){var a=e.fadeIn?clamp((now-e.start)/e.fadeIn,0,1):1;return e.stopping?e.stopAlpha*(1-clamp((now-e.stop)/Math.max(.001,e.fadeOut),0,1)):a*e.intensity;}
function spawn(id,e){var isHeart=e.kind==='hearts'||e.kind==='broken';var kind=isHeart?e.kind:(e.kind==='coins'?'coins':(e.kind==='confetti'||e.kind==='success'?'confetti':'sparks'));var p={id:id,kind:kind,x:Math.random()*width,y:height+20,vx:(Math.random()-.5)*(vr?12:35),vy:-(vr?35:65)-Math.random()*95,size:(vr?7:9)+Math.random()*13,life:2.2+Math.random()*2.0,t:0,angle:Math.random()*6.28,spin:(Math.random()-.5)*2,phase:Math.random()*6.28};if(isHeart)p.vy=-(height+40)/p.life*(vr?.55:1);if(parts.length<180)parts.push(p);}
function heart(x,y,r,broken){ctx.beginPath();ctx.moveTo(x,y+r*.38);ctx.bezierCurveTo(x-r*1.35,y-r*.28,x-r*.52,y-r*1.2,x,y-r*.52);ctx.bezierCurveTo(x+r*.52,y-r*1.2,x+r*1.35,y-r*.28,x,y+r*.38);ctx.fillStyle=broken?'#d898bd':'#f0a5d0';ctx.fill();if(broken){ctx.beginPath();ctx.moveTo(x+2,y-r*.65);ctx.lineTo(x-3,y-r*.22);ctx.lineTo(x+3,y+r*.02);ctx.lineTo(x-1,y+r*.34);ctx.strokeStyle='rgba(45,16,45,.65)';ctx.lineWidth=2;ctx.stroke();}}
function frame(ms){raf=0;var now=ms/1000,dt=Math.min(.05,last?now-last:.016);last=now;ctx.clearRect(0,0,width,height);Object.keys(effects).forEach(function(id){var e=effects[id];if(e.stopping||['vhs','focus','failure','hard','terror'].indexOf(e.kind)>=0)return;var interval=reduced?.5:(vr?.22:.1);if(now-e.lastEmit>interval&&opacity(e,now)>.01){e.lastEmit=now;spawn(id,e);}});
parts=parts.filter(function(p){var e=effects[p.id];if(!e)return false;p.t+=dt;if(p.t>=p.life)return false;p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.phase+p.t*1.5)*12)*dt;p.angle+=p.spin*dt;var a=opacity(e,now)*Math.min(1,p.t/.2,(p.life-p.t)/.6);ctx.globalAlpha=Math.max(0,a);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.kind==='hearts'||p.kind==='broken'?Math.sin(p.t+p.phase)*.16:p.angle);if(p.kind==='hearts'||p.kind==='broken')heart(0,0,p.size,p.kind==='broken');else if(p.kind==='coins'){ctx.fillStyle='#f5cf76';ctx.beginPath();ctx.ellipse(0,0,p.size*.6,p.size*.8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9a6326';ctx.lineWidth=2;ctx.stroke();}else {ctx.fillStyle=['#ecc5dc','#c3b7e9','#bce3d9','#efd8ac'][Math.floor(p.phase)%4];ctx.fillRect(-p.size*.15,-p.size*.3,p.size*.3,p.size*.6);}ctx.restore();return true;});ctx.globalAlpha=1;
if(needsCanvas())start();else last=0;}
window.fnopEffectsDebug=function(){return {layers:Object.keys(effects).length,particles:parts.length,vr:vr};};
addEventListener('pagehide',function(){if(raf)cancelAnimationFrame(raf);raf=0;parts=[];Object.keys(effects).forEach(drop);});
})();
</script></body></html>
