<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batteries</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;align-items:flex-start;justify-content:flex-start;padding:10px}.battery-ui{width:min(540px,calc(100vw - 20px));border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(145deg,rgba(17,12,25,.72),rgba(8,7,13,.52));padding:16px 18px 17px;box-shadow:0 18px 55px rgba(0,0,0,.26);overflow:hidden}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}.name{font-size:24px;font-weight:950;letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}.timer{font-size:28px;font-weight:950;font-variant-numeric:tabular-nums;white-space:nowrap}.desc{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.38;max-width:390px;overflow-wrap:anywhere}.game-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.game-chip{font-size:9px;font-weight:850;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.06);color:#cfe0f2;max-width:100%;overflow-wrap:anywhere}.progress-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:13px}.count{display:flex;align-items:baseline;gap:7px;min-width:0}.count b{font-size:42px;line-height:.9}.count span{color:var(--muted);font-weight:800;font-size:12px;overflow-wrap:anywhere}.remaining{flex:0 0 auto;text-align:right;font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.04em}.remaining b{display:block;margin-top:1px;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}.bar{height:8px;margin-top:11px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .08s linear}.status{margin-top:11px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.04);font-size:11px;color:var(--muted);line-height:1.38;overflow-wrap:anywhere}.battery-ui.danger{border-color:rgba(255,95,116,.55);box-shadow:0 0 45px rgba(255,70,90,.15)}.battery-ui.danger .status{color:#ffd7dc;background:rgba(255,40,70,.11)}@media(max-width:430px){body{padding:6px}.battery-ui{width:calc(100vw - 12px);padding:13px 14px}.name{font-size:20px}.timer{font-size:23px}.count b{font-size:36px}.desc{font-size:10px}}@media(max-height:360px){.battery-ui{padding-top:11px;padding-bottom:11px}.desc{line-height:1.25}.game-meta{margin-top:6px}.progress-head{margin-top:9px}.status{margin-top:8px;padding-top:7px;padding-bottom:7px}}
</style>
<style id="fnop-final4-polish">

html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,.fnop-btn{min-height:46px;touch-action:manipulation;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease,opacity .12s ease}button:not(:disabled):hover,.fnop-btn:not(:disabled):hover{filter:brightness(1.08)}button:not(:disabled):active,.fnop-btn:not(:disabled):active{transform:translateY(1px) scale(.985)}button:focus-visible,.fnop-btn:focus-visible{outline:3px solid rgba(255,255,255,.92);outline-offset:3px}.app,.p-shell,.generic,.battery-ui,.order,.hub,.result{isolation:isolate}.stage,.stage-wrap,.games,.rewards{box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),0 16px 42px rgba(0,0,0,.22)}.chip,.status,.timer,.clock{backdrop-filter:blur(7px)}@media (pointer:coarse){button,.fnop-btn{min-height:54px;min-width:54px}.chip{padding-block:8px}}@media (max-width:900px){.top,.p-head,.order-head,.hub-head{gap:10px}.desc,.game-desc,.hint{line-height:1.35}}

</head><body><section class="battery-ui" id="card"><div class="top"><div><div class="fnop-kicker" data-fnop-i18n="challenge.batteries">CHALLENGE · BATERÍAS</div><div class="name" id="title">BATTERIES</div><div class="desc" id="description"></div><div class="game-meta" id="meta"></div></div><div class="timer" id="time">0:00</div></div><div class="progress-head"><div class="count"><b id="correct">0</b><span>/ <span id="goal">0</span> <span id="greenLabel" data-fnop-i18n="challenge.greenBatteries">GREEN BATTERIES</span></span></div><div class="remaining"><span id="remainingLabel" data-fnop-i18n="challenge.remaining">FALTAN</span><b id="remaining">0</b></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status"></div></section><script>function fnopScoreBadge(d,host){var badge=document.getElementById('moodRoundScore');if(!badge){badge=document.createElement('div');badge.id='moodRoundScore';badge.className='mood-round-score';host.appendChild(badge);}badge.textContent=(d.scoreLabel||(window.FNOPI18n?.t('challenge.score','Score')||'Score'))+': '+String(d.score||0)+(d.hard?' \u00b7 '+(d.hardLabel||(window.FNOPI18n?.t('challenge.hard','Hard: score and rewards x2')||'Hard: score and rewards x2')):'');badge.classList.toggle('hard',!!d.hard);} 
window.fnopSetChallenge=d=>{d=d||{};fnopScoreBadge(d,document.querySelector('#card'));const correct=Number(d.correct??0),goal=Math.max(0,Number(d.goal??0)),remaining=Math.max(0,Number(d.remaining??(goal-correct)));document.querySelector('#title').textContent=d.title||'BATTERIES';document.querySelector('#description').textContent=d.description||d.minigameDescription||'';document.querySelector('#correct').textContent=correct;document.querySelector('#goal').textContent=goal;document.querySelector('#greenLabel').textContent=d.greenLabel||(window.FNOPI18n?.t('challenge.greenBatteries','GREEN BATTERIES')||'GREEN BATTERIES');document.querySelector('#remainingLabel').textContent=d.remainingLabel||(window.FNOPI18n?.t('challenge.remaining','FALTAN')||'FALTAN');document.querySelector('#remaining').textContent=remaining;const t=Math.max(0,Math.ceil(d.time||0)),m=Math.floor(t/60),s=t%60;document.querySelector('#time').textContent=d.unlimited?'∞':`${m}:${String(s).padStart(2,'0')}`;const meta=[];if(d.minigameObjective)meta.push(`◎ ${d.minigameObjective}`);const mins=Math.round((Number(d.duration||0)/60)*100)/100;meta.push(d.unlimited?('⏱ '+(window.FNOPI18n?.t('challenge.noLimit','SIN LIMITE')||'SIN LIMITE')):`⏱ ${mins} MIN`);meta.push(`◉ ${(d.goalLabel||(window.FNOPI18n?.t('challenge.objective','OBJETIVO')||'OBJETIVO'))}: ${goal}`);if(d.minigameCoins||d.minigameSpins||d.minigameChests)meta.push(`🪙 ${d.minigameCoins||0} · 🎟️ ${d.minigameSpins||0} · ▣ ${d.minigameChests||0}`);const metaEl=document.querySelector('#meta');metaEl.innerHTML=meta.map(()=>'<span class="game-chip"></span>').join('');[...metaEl.children].forEach((el,i)=>el.textContent=meta[i]);document.querySelector('#fill').style.width=`${Math.max(0,Math.min(1,d.progress||0))*100}%`;document.querySelector('#status').textContent=d.status||'';document.querySelector('#card').classList.toggle('danger',!!d.danger)};
</script></body></html>
