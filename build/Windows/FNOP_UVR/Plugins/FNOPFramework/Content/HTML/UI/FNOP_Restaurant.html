<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant</title><style>
body{display:grid;place-items:center}.order{width:min(440px,96vw);border:1px solid rgba(255,255,255,.13);border-radius:24px;background:linear-gradient(155deg,rgba(23,17,30,.72),rgba(8,7,13,.56));padding:18px;box-shadow:0 22px 65px rgba(0,0,0,.28)}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.game-desc{margin-top:3px;max-width:270px;color:var(--muted);font-size:9px;line-height:1.3}.order-name{margin-top:3px;font-size:25px;font-weight:950;letter-spacing:-.04em}.clock{text-align:right;font-size:24px;font-weight:950;font-variant-numeric:tabular-nums}.shift{font-size:9px;color:var(--muted);margin-top:3px}.stage{height:325px;margin-top:14px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:radial-gradient(circle at 50% 75%,rgba(255,85,185,.08),transparent 45%),rgba(255,255,255,.018);position:relative;overflow:hidden}.stack{position:absolute;inset:18px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding-bottom:20px}.ingredient{width:78%;height:38px;margin-top:-3px;display:grid;place-items:center;position:relative;opacity:0;transform:translateY(-150px) scale(.94);animation:drop .48s var(--ease) forwards}.ingredient img{width:100%;height:100%;object-fit:contain}.shape{width:82%;height:70%;border-radius:50%}.i0 .shape,.i7 .shape{background:linear-gradient(#eeb95e,#ae6b2f);border:2px solid rgba(255,222,150,.5)}.i1 .shape{background:linear-gradient(#75402f,#3c211b);height:58%}.i2 .shape{background:#ffd84f;height:34%;border-radius:6px;transform:rotate(-2deg)}.i3 .shape{background:repeating-linear-gradient(90deg,#d7c6ef 0 7px,#8967aa 7px 12px);height:22%}.i4 .shape{background:#eb6a5d;height:26%}.i5 .shape{background:#83bf61;height:25%}.i6 .shape{background:#e58a47;height:18%}.i8 .shape{width:34%;height:90%;border-radius:9px 9px 18px 18px;background:linear-gradient(90deg,#8ed8ff,#d4f4ff)}.ingredient-label{position:absolute;right:-3px;top:50%;transform:translate(100%,-50%);font-size:8px;color:rgba(255,255,255,.42);white-space:nowrap}.complete .ingredient{box-shadow:0 0 12px rgba(255,235,170,.12)}.watch{display:none;position:absolute;inset:0;z-index:4;place-items:center;text-align:center;background:rgba(80,4,15,.84);font-size:25px;font-weight:950;letter-spacing:.04em}.order.watching .watch{display:grid}.footer{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:10px;font-weight:800}.drink{color:var(--cyan)}@keyframes drop{65%{opacity:1;transform:translateY(5px) scale(1.02)}100%{opacity:1;transform:none}}@keyframes vanish{to{opacity:0;transform:translateY(30px) scale(.96)}}
</style>
<style id="fnop-final4-polish">

html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,.fnop-btn{min-height:46px;touch-action:manipulation;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease,opacity .12s ease}button:not(:disabled):hover,.fnop-btn:not(:disabled):hover{filter:brightness(1.08)}button:not(:disabled):active,.fnop-btn:not(:disabled):active{transform:translateY(1px) scale(.985)}button:focus-visible,.fnop-btn:focus-visible{outline:3px solid rgba(255,255,255,.92);outline-offset:3px}.app,.p-shell,.generic,.battery-ui,.order,.hub,.result{isolation:isolate}.stage,.stage-wrap,.games,.rewards{box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),0 16px 42px rgba(0,0,0,.22)}.chip,.status,.timer,.clock{backdrop-filter:blur(7px)}@media (pointer:coarse){button,.fnop-btn{min-height:54px;min-width:54px}.chip{padding-block:8px}}@media (max-width:900px){.top,.p-head,.order-head,.hub-head{gap:10px}.desc,.game-desc,.hint{line-height:1.35}}
</style>
</head><body><section class="order" id="order"><div class="order-head"><div><div class="fnop-kicker"><span id="gameTitle">FNOP RESTAURANT</span> · <span id="orderLabel" data-fnop-i18n="restaurant.order">ORDER</span></div><div class="game-desc" id="gameDescription"></div><div class="order-name" id="name" data-fnop-i18n="restaurant.waiting">WAITING…</div></div><div><div class="clock" id="time">0:00</div><div class="shift" id="shift"></div></div></div><div class="stage"><div class="stack" id="stack"></div><div class="watch" id="watch"><div><span id="watchTitle" data-fnop-i18n="restaurant.watching">CUSTOMER WATCHING</span><br><small id="watchDetail" data-fnop-i18n="restaurant.actNatural">STOP AND ACT NATURAL</small></div></div></div><div class="footer"><span id="progress"></span><span class="drink" id="drink"></span></div></section><script>function fnopScoreBadge(d,host){var badge=document.getElementById('moodRoundScore');if(!badge){badge=document.createElement('div');badge.id='moodRoundScore';badge.className='mood-round-score';host.appendChild(badge);}badge.textContent=(d.scoreLabel||(window.FNOPI18n?.t('challenge.score','Score')||'Score'))+': '+String(d.score||0)+(d.hard?' \u00b7 '+(d.hardLabel||(window.FNOPI18n?.t('challenge.hard','Hard: score and rewards x2')||'Hard: score and rewards x2')):'');badge.classList.toggle('hard',!!d.hard);} 
let state={},sig='',cycleTimer=0;const q=s=>document.querySelector(s);function fmt(v){v=Math.max(0,Math.ceil(v||0));return `${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`}function build(){clearTimeout(cycleTimer);const root=q('#stack');root.innerHTML='';(state.layers||[]).forEach((x,i)=>{const d=document.createElement('div');d.className=`ingredient i${x.type}`;d.style.animationDelay=`${i*.30}s`;d.innerHTML=x.image?`<img src="${x.image}"><span class="ingredient-label"></span>`:`<div class="shape"></div><span class="ingredient-label"></span>`;d.querySelector('.ingredient-label').textContent=x.name||'';root.appendChild(d)});const total=(state.layers||[]).length*.30+.7;cycleTimer=setTimeout(()=>{root.classList.add('complete');setTimeout(()=>{[...root.children].forEach((x,i)=>{x.style.animation=`vanish .30s ${i*.035}s ease forwards`});setTimeout(()=>{root.classList.remove('complete');build()},650)},850)},total*1000)}window.fnopSetRestaurant=d=>{state=d||{};fnopScoreBadge(state,document.querySelector('#order'));q('#gameTitle').textContent=state.minigameName||'FNOP RESTAURANT';q('#gameDescription').textContent=state.minigameDescription||'';q('#orderLabel').textContent=state.title||(window.FNOPI18n?.t('restaurant.order','ORDER')||'ORDER');q('#name').textContent=state.name||state.waiting||(window.FNOPI18n?.t('restaurant.waiting','WAITING…')||'WAITING…');q('#time').textContent=fmt(state.time);q('#shift').textContent=`${state.shiftLabel||(window.FNOPI18n?.t('restaurant.shift','SHIFT')||'SHIFT')} ${state.shiftUnlimited?'∞':fmt(state.shift)}`;q('#progress').textContent=`${state.ordersLabel||(window.FNOPI18n?.t('restaurant.orders','ORDERS')||'ORDERS')} ${state.done||0} / ${state.goal||0}`;q('#drink').textContent=state.drink?(state.drinkLabel||(window.FNOPI18n?.t('restaurant.drinkIncluded','DRINK INCLUDED')||'DRINK INCLUDED')):'';q('#watchTitle').textContent=state.watchingLabel||(window.FNOPI18n?.t('restaurant.watching','CUSTOMER WATCHING')||'CUSTOMER WATCHING');q('#watchDetail').textContent=state.watchingDetail||(window.FNOPI18n?.t('restaurant.actNatural','STOP AND ACT NATURAL')||'STOP AND ACT NATURAL');q('#order').classList.toggle('watching',!!state.watching);const next=JSON.stringify((state.layers||[]).map(x=>[x.type,x.image,x.name]));if(next!==sig){sig=next;build()}};
</script></body></html>
