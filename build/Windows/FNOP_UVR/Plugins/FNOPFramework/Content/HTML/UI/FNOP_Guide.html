<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide</title><style>
body{display:grid;place-items:center}.guide{--c:var(--accent);width:96%;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:13px;padding:13px 16px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:18px;background:rgba(10,8,16,.72);box-shadow:0 12px 35px rgba(0,0,0,.28)}.pin{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--c) 65%,white 5%);background:color-mix(in srgb,var(--c) 15%,transparent);font-size:22px}.txt{font-size:15px;font-weight:850;line-height:1.18}.meters{font-size:22px;font-weight:950;white-space:nowrap;color:var(--c)}.meters small{font-size:10px;letter-spacing:.12em;margin-left:3px}
</style></head><body><div class="guide" id="g"><div class="pin">⌄</div><div class="txt" id="t"></div><div class="meters"><span id="m">0</span><small>M</small></div></div><script>window.fnopSetGuide=d=>{d=d||{};document.querySelector('#t').textContent=d.text||'';document.querySelector('#m').textContent=(d.meters??0).toFixed(d.meters<10?1:0);document.querySelector('#g').style.setProperty('--c',d.color||'#ff55b9')}</script></body></html>
