<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Runtime</title>
<style>
html,body{pointer-events:none}.fnop-screen{justify-content:flex-start;align-items:flex-start;background:transparent;padding:0}.fnop-screen::before,.fnop-screen::after{display:none}.runtime{width:min(720px,94vw);border:1px solid rgba(255,255,255,.11);border-radius:20px;background:linear-gradient(135deg,rgba(18,14,26,.96),rgba(8,7,13,.94));padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.25);transition:border-color .10s,background .10s}.runtime.warning{width:min(610px,90vw);border-color:rgba(255,108,130,.72);background:linear-gradient(135deg,rgba(73,15,29,.985),rgba(18,8,15,.975));padding:14px 16px;border-radius:16px;box-shadow:0 14px 38px rgba(0,0,0,.42)}.runtime h2{margin:0;font-size:25px;letter-spacing:-.035em}.runtime.warning h2{font-size:21px;line-height:1.15}.runtime p{margin:7px 0 0;color:var(--muted);line-height:1.45;white-space:pre-line}.runtime.warning p{margin-top:5px;font-size:14px;line-height:1.36;color:rgba(255,240,244,.92)}.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:14px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .08s linear}.mission{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07)}.step{display:flex;gap:8px;align-items:flex-start;padding:3px 0;color:#a99fb2;font-size:13px}.step.current{color:#fff;font-weight:800}.step.done{color:#8ee6aa}.mark{width:18px;color:var(--accent);font-weight:900}
.guide{position:fixed;inset:0;display:none;pointer-events:auto;background:rgba(0,0,0,.82);align-items:center;justify-content:center;padding:24px}.guide.show{display:flex}.guide-card{width:min(920px,92vw);max-height:90vh;overflow:auto;border:1px solid rgba(126,233,255,.28);border-radius:24px;background:linear-gradient(145deg,rgba(8,17,28,.99),rgba(18,8,24,.99));padding:22px;box-shadow:0 28px 80px rgba(0,0,0,.65)}.guide-card h1{margin:0 0 8px;font-size:32px}.guide-card p{white-space:pre-line;color:#d7d4df;line-height:1.55}.guide-img{width:100%;max-height:54vh;object-fit:contain;border-radius:16px;background:#05070b;margin:12px 0}.guide-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}.guide button{pointer-events:auto;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.08);color:white;font-weight:900}.guide button.primary{background:#42c9ef;color:#061018}.guide-count{min-width:68px;text-align:center;color:#aeefff;font-weight:900}</style></head><body><main class="fnop-screen"><section class="runtime" id="runtime"><div class="fnop-kicker" id="kicker">FNOP</div><h2 id="title"></h2><p id="message"></p><div class="progress" id="progress"><i id="bar"></i></div><div class="mission" id="mission"></div></section></main><div class="guide" id="guide"><section class="guide-card"><h1 id="guideTitle"></h1><p id="guideText"></p><img class="guide-img" id="guideImage"><div class="guide-nav"><button data-fnop-action="guideprev" id="guidePrev">←</button><span class="guide-count" id="guideCount"></span><button data-fnop-action="guidenext" id="guideNext">→</button><button class="primary" data-fnop-action="guideaccept" id="guideAccept">ENTENDIDO</button></div></section></div>
<script>
window.fnopSetRuntime=d=>{if(!d)return;const root=document.getElementById('runtime');const g=document.getElementById('guide');g.classList.toggle('show',!!d.showGuide);document.getElementById('guideTitle').textContent=d.guideTitle||'';document.getElementById('guideText').textContent=d.guideText||'';const gi=document.getElementById('guideImage');gi.style.display=d.guideImage?'block':'none';if(d.guideImage)gi.src=d.guideImage;document.getElementById('guideCount').textContent=d.guideCount>1?((Number(d.guideIndex||0)+1)+' / '+d.guideCount):'';document.getElementById('guidePrev').style.display=d.guideCount>1?'inline-block':'none';document.getElementById('guideNext').style.display=d.guideCount>1?'inline-block':'none';document.getElementById('guideAccept').textContent=d.guideAccept||'ENTENDIDO';root.classList.toggle('warning',!!d.warning);document.getElementById('title').textContent=d.title||'';document.getElementById('message').textContent=d.message||'';document.getElementById('progress').style.display=d.showProgress?'block':'none';document.getElementById('bar').style.width=Math.max(0,Math.min(100,Number(d.progress||0)*100))+'%';const m=document.getElementById('mission');m.style.display=d.showMission?'block':'none';m.innerHTML='';(d.steps||[]).forEach((s,i)=>{const el=document.createElement('div');el.className='step '+(i<d.currentStep?'done':i===d.currentStep?'current':'');el.innerHTML=`<span class="mark">${i<d.currentStep?'✓':i===d.currentStep?'›':'·'}</span><span></span>`;el.lastChild.textContent=s;m.appendChild(el)});};
</script></body></html>
