<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Trade</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;overflow:hidden}.panel{width:min(1400px,96vw);height:min(800px,94vh);margin:2vh auto;background:rgba(13,10,18,.96);border:1px solid rgba(255,255,255,.13);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.48);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.head{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}.title{font-size:26px;font-weight:900}.sub{font-size:12px;color:#aaa}.columns{display:grid;grid-template-columns:1fr 1fr;min-height:0}.side{padding:18px 22px;overflow:auto}.side+ .side{border-left:1px solid rgba(255,255,255,.08)}.side h2{margin:0 0 12px;font-size:17px}.resources{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.resource{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);padding:12px;border-radius:14px}.resource label{display:block;font-size:10px;color:#aaa;margin-bottom:6px}.resource input{width:100%;border:0;border-radius:8px;background:#09070d;color:#fff;padding:9px;font-weight:800}.wallet{font-size:10px;color:#777;margin-top:4px}.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.char{padding:11px;border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(255,255,255,.035);min-height:58px;text-align:left;color:#fff;cursor:pointer}.char.selected{border-color:#6eeeff;background:rgba(110,238,255,.12);box-shadow:0 0 18px rgba(110,238,255,.10) inset}.remote .char{cursor:default}.empty{font-size:12px;color:#777;padding:15px 0}.foot{padding:15px 22px;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.state{font-size:12px;color:#ccc}.checks{display:flex;gap:12px;margin-top:6px;font-size:10px}.ok{color:#96ffae}.wait{color:#ffc96e}.buttons{display:flex;gap:10px}.btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#5b42e6,#1cb8d0);border-color:rgba(110,238,255,.5)}.btn:disabled{opacity:.45;cursor:not-allowed}@media(max-width:850px){.columns{grid-template-columns:1fr 1fr}.chars{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{height:96vh;margin:1vh auto}}
</style></head><body><main class="panel"><header class="head"><div><div class="title">INTERCAMBIO MULTIJUGADOR</div><div class="sub" id="partner">Jugador</div></div><button class="btn" id="cancel">CANCELAR</button></header><section class="columns"><div class="side"><h2>TÚ OFRECES</h2><div class="resources"><div class="resource"><label>MONEDAS</label><input id="coins" type="number" min="0" value="0"><div class="wallet" id="walletCoins"></div></div><div class="resource"><label>TIRADAS</label><input id="spins" type="number" min="0" value="0"><div class="wallet" id="walletSpins"></div></div></div><div id="candidates" class="chars"></div></div><div class="side remote"><h2>EL OTRO JUGADOR OFRECE</h2><div class="resources"><div class="resource"><label>MONEDAS</label><strong id="remoteCoins">0</strong></div><div class="resource"><label>TIRADAS</label><strong id="remoteSpins">0</strong></div></div><div id="remoteChars" class="chars"></div></div></section><footer class="foot"><div><div class="state" id="status">Configura tu oferta.</div><div class="checks"><span id="localCheck" class="wait">TÚ: SIN CONFIRMAR</span><span id="remoteCheck" class="wait">OTRO: SIN CONFIRMAR</span></div></div><div class="buttons"><button class="btn primary" id="accept">ACEPTAR OFERTA</button></div></footer></main>
<script>
const q=s=>document.querySelector(s);let state={};let debounce=0;function act(n,p=''){window.fnopAction?.(n,String(p))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderChars(host,arr,selected,interactive){host.innerHTML='';if(!arr?.length){host.innerHTML='<div class="empty">Sin personajes</div>';return}(arr||[]).forEach(c=>{const b=document.createElement('button');b.className='char'+(selected?.includes(c.id)||c.selected?' selected':'');b.textContent=c.name||c.id;if(interactive)b.onclick=()=>act('trade_toggle_character',c.id);else b.disabled=true;host.appendChild(b)})}function sendResource(){clearTimeout(debounce);debounce=setTimeout(()=>{act('trade_coins',Math.max(0,Math.floor(Number(q('#coins').value)||0)));act('trade_spins',Math.max(0,Math.floor(Number(q('#spins').value)||0)))},120)}q('#coins').addEventListener('input',sendResource);q('#spins').addEventListener('input',sendResource);q('#accept').onclick=()=>act('trade_accept');q('#cancel').onclick=()=>act('trade_cancel');window.fnopSetTrade=s=>{state=s||{};q('#partner').textContent='Con '+(state.partner||'Jugador');q('#status').textContent=state.status||'';const lo=state.localOffer||{},ro=state.remoteOffer||{};if(document.activeElement!==q('#coins'))q('#coins').value=lo.coins||0;if(document.activeElement!==q('#spins'))q('#spins').value=lo.spins||0;q('#walletCoins').textContent='Disponible: '+(state.walletCoins||0);q('#walletSpins').textContent='Disponible: '+(state.walletSpins||0);q('#remoteCoins').textContent=ro.coins||0;q('#remoteSpins').textContent=ro.spins||0;renderChars(q('#candidates'),state.candidates||[],(lo.characters||[]).map(x=>x.id),true);renderChars(q('#remoteChars'),ro.characters||[],[],false);q('#localCheck').textContent=state.localAccepted?'TÚ: CONFIRMADO':'TÚ: SIN CONFIRMAR';q('#localCheck').className=state.localAccepted?'ok':'wait';q('#remoteCheck').textContent=state.remoteAccepted?'OTRO: CONFIRMADO':'OTRO: SIN CONFIRMAR';q('#remoteCheck').className=state.remoteAccepted?'ok':'wait';q('#accept').disabled=!!state.localAccepted};
</script></body></html>
