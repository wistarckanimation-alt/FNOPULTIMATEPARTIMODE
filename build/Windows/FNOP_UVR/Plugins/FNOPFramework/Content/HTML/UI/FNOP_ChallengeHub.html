<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Minigames</title><style>
.hub{width:min(1420px,97vw);height:min(850px,94vh);display:grid;grid-template-rows:auto auto 1fr}.hub-head{align-items:flex-end}.hub-sub{margin-top:8px;max-width:780px;color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}.tab{min-width:110px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#dce8f6;font-weight:900;letter-spacing:.08em}.tab.on{background:linear-gradient(100deg,var(--pink),var(--cyan));color:#07101c;border-color:transparent}.games{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;align-content:start}.game{min-height:390px;display:grid;grid-template-rows:130px 1fr auto;text-align:left;padding:0;cursor:pointer;position:relative;overflow:hidden}.game-art{background:radial-gradient(circle at 50% 38%,rgba(255,85,185,.18),transparent 65%),rgba(255,255,255,.02);padding:14px}.game-body{padding:15px 16px 8px}.game-title{font-size:22px;font-weight:950;letter-spacing:-.03em}.game-desc{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5}.game-play{margin:10px 16px 15px;height:43px}.badge{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:9px;background:#06101bd9;border:1px solid #ffffff1b;font-size:9px;letter-spacing:.14em;font-weight:950}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.prizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.prize{font-size:10px;font-weight:850;padding:5px 7px;border-radius:8px;background:#ffffff08;color:#cfe0f2}.game.locked{border-color:#ff435c66;background:linear-gradient(160deg,#2a0b12dd,#11070bee);cursor:not-allowed}.game.locked .game-art{filter:grayscale(1) blur(10px) brightness(.43);transform:scale(1.08)}.lock{position:absolute;right:12px;top:10px;font-size:25px}.unlock{margin-top:10px;color:#ff7586;font-size:11px;font-weight:950;letter-spacing:.05em}.game.locked .game-play{background:#54121d;border-color:#ff435c55;color:#ff9ba8}.empty{grid-column:1/-1;padding:70px;text-align:center;color:var(--muted)}
</style>
<style id="fnop-final4-polish">
/* FNOP 1.33.0: lectura y control reforzados para pantallas 3D, raton y puntero VR. */
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,.fnop-btn{min-height:46px;touch-action:manipulation;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease,opacity .12s ease}button:not(:disabled):hover,.fnop-btn:not(:disabled):hover{filter:brightness(1.08)}button:not(:disabled):active,.fnop-btn:not(:disabled):active{transform:translateY(1px) scale(.985)}button:focus-visible,.fnop-btn:focus-visible{outline:3px solid rgba(255,255,255,.92);outline-offset:3px}.app,.p-shell,.generic,.battery-ui,.order,.hub,.result{isolation:isolate}.stage,.stage-wrap,.games,.rewards{box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),0 16px 42px rgba(0,0,0,.22)}.chip,.status,.timer,.clock{backdrop-filter:blur(7px)}@media (pointer:coarse){button,.fnop-btn{min-height:54px;min-width:54px}.chip{padding-block:8px}}@media (max-width:900px){.top,.p-head,.order-head,.hub-head{gap:10px}.desc,.game-desc,.hint{line-height:1.35}}
</style>
</head><body><main class="fnop-screen"><section class="fnop-panel hub"><header class="fnop-head hub-head"><div><div class="fnop-kicker">FNOP · <span id="mode">MINIJUEGOS</span></div><h1 class="fnop-title" id="title">MINIJUEGOS</h1><div class="hub-sub" id="subtitle"></div></div><button class="fnop-btn" id="back">← MENU</button></header><div class="tabs" id="tabs"></div><div class="fnop-scroll"><div class="games" id="games"></div></div></section></main><script>
let st={games:[],play:'JUGAR',back:'VOLVER AL MENU',empty:'NO HAY MINIJUEGOS',minigame:'MINIJUEGO',mode:'TODOS LOS MODOS'},filter='TODOS';
const e=s=>document.querySelector(s);
function img(src){return src?`<img class="fnop-img" src="${src}">`:`<div class="fnop-empty" style="height:100%">FNOP</div>`}
function categories(){let a=['TODOS'];for(const g of st.games||[]){let c=(g.category||'OTROS').toUpperCase();if(!a.includes(c))a.push(c)}return a}
function renderTabs(){const root=e('#tabs');root.innerHTML='';for(const c of categories()){const b=document.createElement('button');b.className='tab'+(filter===c?' on':'');b.textContent=c;b.onclick=()=>{filter=c;renderTabs();renderGames()};root.appendChild(b)}}
function n(v){const x=Number(v||0);return Number.isInteger(x)?String(x):x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}
function renderGames(){
 const root=e('#games');root.innerHTML='';let gs=(st.games||[]).filter(g=>filter==='TODOS'||(g.category||'OTROS').toUpperCase()===filter);
 if(!gs.length){root.innerHTML=`<div class="empty">${st.empty||'NO HAY MINIJUEGOS'}</div>`;return}
 gs.forEach((g,i)=>{
  const b=document.createElement('button');b.className='fnop-card game';b.style.animation=`fnopCardIn .16s ${Math.min(i*20,160)}ms var(--ease) both`;if(g.locked)b.classList.add('locked');
  const duration=g.unlimited?(st.unlimitedLabel||'SIN LIMITE'):`${n(g.durationMinutes)} ${st.minutesLabel||'MIN'}`;
  const mapMeta=g.kind==='map'?`<div class="meta"><span class="prize">⏱ ${duration}</span><span class="prize">◎ ${g.objective||''}</span></div><div class="prizes"><span class="prize">🪙 ${g.coins||0}</span><span class="prize">🎟️ ${g.spins||0}</span><span class="prize">▣ ${g.chests||0}</span></div>`:`<div class="prizes"><span class="prize">🪙 hasta ${g.coins||0}</span><span class="prize">🎟️ hasta ${g.spins||0}</span><span class="prize">⏱ ${Math.round(g.duration||0)}s</span></div>`;
  b.innerHTML=`<div class="badge">${g.category||g.kind||'MINIJUEGO'}</div>${g.locked?'<div class="lock">🔒</div>':''}<div class="game-art">${img(g.image)}</div><div class="game-body"><div class="fnop-kicker">${g.kind==='arcade'?'PC + VR':'MAPA'} · ${st.minigame||'MINIJUEGO'}</div><div class="game-title"></div><div class="game-desc"></div>${g.locked?'<div class="unlock"></div>':''}${mapMeta}</div><div class="fnop-btn primary game-play"></div>`;
  b.querySelector('.game-title').textContent=g.name||g.id;b.querySelector('.game-desc').textContent=g.description||'';if(g.locked)b.querySelector('.unlock').textContent=g.unlockText||'BLOQUEADO';b.querySelector('.game-play').textContent=g.locked?'🔒 BLOQUEADO':(st.play||'JUGAR');b.onclick=()=>{if(!g.locked&&window.fnopAction)window.fnopAction('play',g.id)};root.appendChild(b)
 })
}
window.fnopSetChallengeHub=d=>{st=d||st;e('#title').textContent=st.title||'MINIJUEGOS';e('#subtitle').textContent=st.subtitle||'';e('#mode').textContent=st.mode||'TODOS LOS MODOS';e('#back').textContent='← '+(st.back||'VOLVER AL MENU');if(!categories().includes(filter))filter='TODOS';renderTabs();renderGames()};
e('#back').onclick=()=>window.fnopAction&&window.fnopAction('back','');
</script></body></html>
