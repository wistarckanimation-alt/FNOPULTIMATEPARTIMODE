<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}.root{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:34px}.card{position:relative;width:100%;height:100%;border:2px solid rgba(196,106,255,.72);border-radius:34px;background:radial-gradient(circle at 50% 25%,rgba(108,41,166,.34),transparent 42%),rgba(10,7,24,.94);box-shadow:0 22px 80px rgba(0,0,0,.55),inset 0 0 55px rgba(139,57,213,.12);display:grid;grid-template-columns:42% 58%;align-items:center;padding:42px 48px;gap:28px}.art{height:100%;display:flex;align-items:center;justify-content:center}.figure{position:relative;width:290px;height:330px}.head{position:absolute;left:112px;top:15px;width:66px;height:66px;border:8px solid #d78cff;border-radius:50%;box-shadow:0 0 28px #a63cff}.body{position:absolute;left:139px;top:82px;width:12px;height:137px;background:#d78cff;border-radius:8px;box-shadow:0 0 20px #a63cff}.arms{position:absolute;left:16px;top:116px;width:258px;height:12px;background:#d78cff;border-radius:8px;box-shadow:0 0 20px #a63cff}.legL,.legR{position:absolute;top:210px;width:12px;height:112px;background:#d78cff;border-radius:8px;transform-origin:top}.legL{left:140px;transform:rotate(17deg)}.legR{left:140px;transform:rotate(-17deg)}.handL,.handR{position:absolute;top:102px;width:34px;height:40px;border:5px solid #ffd93d;border-radius:9px;box-shadow:0 0 18px rgba(255,217,61,.65)}.handL{left:-8px}.handR{right:-8px}.copy h1{margin:0 0 10px;font-size:42px;letter-spacing:.02em}.copy h2{margin:0 0 22px;color:#d78cff;font-size:24px}.copy p{margin:8px 0;font-size:20px;line-height:1.45;color:#e8ddf2}.ready{margin-top:24px;padding:15px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.13);font-size:18px;font-weight:800;letter-spacing:.02em;background:rgba(255,255,255,.055)}.ready.ok{border-color:rgba(89,255,166,.5);color:#8fffc1}.ready.err{border-color:rgba(255,90,116,.65);color:#ff8799}.hint{margin-top:10px!important;color:#bba8cb!important;font-size:16px!important}
</style></head><body><div class="root"><main class="card"><div class="art"><div class="figure"><div class="head"></div><div class="body"></div><div class="arms"></div><div class="legL"></div><div class="legR"></div><div class="handL"></div><div class="handR"></div></div></div><section class="copy"><h1 id="title"></h1><h2 id="pose"></h2><p id="line1"></p><p id="line2"></p><p id="line3"></p><div id="ready" class="ready"></div><p id="hint" class="hint"></p></section></main></div><script>
window.fnopVRCalibrationSet=function(s){s=s||{};for(const k of ['title','pose','line1','line2','line3','ready','hint']){const e=document.getElementById(k);if(e)e.textContent=s[k]||'';}const r=document.getElementById('ready');if(r){r.className='ready'+(s.error?' err':(s.ok?' ok':''));}};
</script></body></html>
