<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Reward Toast</title></head><body>
<div id="rewardToast" class="reward-toast" aria-live="polite">
  <div class="reward-glow"></div><div class="reward-edge"></div><div class="reward-sparks" id="rewardSparks"></div><div id="rewardImage" class="reward-image fnop-reward-visual" data-fnop-reward-visual="1"></div>
  <div class="reward-copy"><div class="reward-kicker" id="rewardKicker">NUEVO EN INVENTARIO</div><div id="rewardTitle" class="reward-title">RECOMPENSA</div><div id="rewardDetail" class="reward-detail"></div></div>
  <div class="reward-shine"></div>
</div>
<style>
html,body{background:transparent!important;overflow:hidden!important}.fnop-screen::before,.fnop-screen::after{display:none!important}
.reward-toast{--reward:#ff55b9;position:fixed;left:28px;top:50%;width:min(470px,calc(100vw - 56px));min-height:126px;display:grid;grid-template-columns:94px 1fr;gap:16px;align-items:center;padding:15px 20px 15px 14px;border:1px solid rgba(255,255,255,.16);border-left:3px solid var(--reward);border-radius:22px;background:linear-gradient(120deg,rgba(15,9,23,.94),rgba(22,14,33,.91));box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 42px color-mix(in srgb,var(--reward) 24%,transparent);opacity:0;transform:translate(-35px,-50%) scale(.94);pointer-events:none;overflow:hidden}
.reward-toast.show{animation:rewardIn .28s cubic-bezier(.16,.9,.25,1.15) forwards}.reward-toast.hide{animation:rewardOut .22s ease-in forwards}.reward-image{width:94px;height:94px;border-radius:17px;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.025));background-size:contain;background-position:center;background-repeat:no-repeat;box-shadow:inset 0 0 28px rgba(255,255,255,.035)}.reward-copy{min-width:0}.reward-kicker{font-size:9px;letter-spacing:.30em;color:var(--reward);font-weight:900}.reward-title{margin-top:7px;font-size:22px;line-height:1;font-weight:950;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reward-detail{margin-top:8px;color:rgba(255,255,255,.70);font-size:12px;line-height:1.35}.reward-edge{position:absolute;left:0;top:12%;bottom:12%;width:2px;background:var(--reward);box-shadow:0 0 16px var(--reward);animation:edgePulse 1.1s ease-in-out infinite alternate}.reward-sparks{position:absolute;inset:0;overflow:hidden;pointer-events:none}.reward-sparks i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--reward);box-shadow:0 0 8px var(--reward);animation:spark .72s ease-out forwards}.reward-glow{position:absolute;width:190px;height:190px;left:-70px;top:-50px;background:radial-gradient(circle,color-mix(in srgb,var(--reward) 28%,transparent),transparent 68%);pointer-events:none}.reward-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.16) 48%,transparent 66%);transform:translateX(-120%);pointer-events:none}.reward-toast.show .reward-shine{animation:rewardShine .6s .08s ease-out forwards}@keyframes edgePulse{to{opacity:.35;transform:scaleY(.72)}}@keyframes spark{from{opacity:0;transform:translateX(-8px) scale(.2)}35%{opacity:1}to{opacity:0;transform:translate(120px,-18px) scale(1.5)}}@keyframes rewardIn{to{opacity:1;transform:translate(0,-50%) scale(1)}}@keyframes rewardOut{from{opacity:1;transform:translate(0,-50%) scale(1)}to{opacity:0;transform:translate(-24px,-50%) scale(.96)}}@keyframes rewardShine{to{transform:translateX(120%)}}@media(max-width:700px){.reward-toast{left:14px;width:calc(100vw - 28px);grid-template-columns:72px 1fr;min-height:100px}.reward-image{width:72px;height:72px}.reward-title{font-size:18px}}
</style>
<script>
let rewardTimer=0;window.fnopShowReward=function(d){d=d||{};const t=document.getElementById('rewardToast');clearTimeout(rewardTimer);t.classList.remove('show','hide');void t.offsetWidth;t.style.setProperty('--reward',d.color||'#ff55b9');document.getElementById('rewardKicker').textContent=d.kicker||'NEW IN INVENTORY';document.getElementById('rewardTitle').textContent=d.title||'REWARD';document.getElementById('rewardDetail').textContent=d.detail||'';const sparks=document.getElementById('rewardSparks');sparks.innerHTML='';for(let i=0;i<9;i++){const x=document.createElement('i');x.style.left=(10+Math.random()*24)+'px';x.style.top=(25+Math.random()*70)+'%';x.style.animationDelay=(Math.random()*.16)+'s';sparks.appendChild(x)};const image=document.getElementById('rewardImage');image.style.backgroundImage=d.image?`url("${d.image}")`:'';if(window.FNOPRewardVisuals)window.FNOPRewardVisuals.decorate(image,d.color||'#ff55b9');t.classList.add('show');const ms=Math.max(1500,Number(d.duration||4200));rewardTimer=setTimeout(()=>{t.classList.remove('show');t.classList.add('hide')},ms)};
</script></body></html>
