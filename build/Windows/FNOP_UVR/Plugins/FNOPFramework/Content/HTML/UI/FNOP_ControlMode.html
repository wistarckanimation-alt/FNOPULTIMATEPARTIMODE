<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Control Mode</title>
<style>
:root{--accent:#7df5ff;--accent2:#8f63ff}.mode-panel{width:min(980px,94vw);padding:34px}.mode-title{text-align:center;margin-bottom:28px}.mode-title h1{font-size:clamp(32px,5vw,58px);margin:6px 0 8px;letter-spacing:-.05em}.mode-title p{margin:0;color:var(--muted)}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mode-choice{min-height:260px;padding:28px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}.mode-code{position:absolute;top:22px;right:22px;font-size:52px;font-weight:900;opacity:.07}.mode-choice h2{margin:0 0 10px;font-size:30px}.mode-choice p{margin:0;color:var(--muted);line-height:1.5}.mode-choice .go{margin-top:20px;color:var(--accent);font-weight:900;letter-spacing:.13em;font-size:11px}@media(max-width:720px){.mode-grid{grid-template-columns:1fr}.mode-choice{min-height:170px}}
</style></head><body><main class="fnop-screen" id="screen"><section class="fnop-panel mode-panel"><div class="mode-title"><div class="fnop-kicker" data-fnop-i18n="control.detected">MODO DE CONTROL</div><h1 data-fnop-i18n="control.title">¿CÓMO QUIERES JUGAR?</h1><p data-fnop-i18n="control.subtitle">Elige cómo quieres jugar. Puedes cambiarlo después desde Ajustes.</p></div><div class="mode-grid"><button class="fnop-card mode-choice" data-mode="vr"><span class="mode-code">VR</span><h2 data-fnop-i18n="control.vr">REALIDAD VIRTUAL</h2><p data-fnop-i18n="control.vrDesc">Visor y mandos OpenXR. Interacción física completa.</p><span class="go" data-fnop-i18n="control.enterVr">ENTRAR EN VR →</span></button><button class="fnop-card mode-choice" data-mode="desktop"><span class="mode-code">PC</span><h2 data-fnop-i18n="control.pc">PRIMERA PERSONA</h2><p data-fnop-i18n="control.pcDesc">WASD, ratón y emulación de controles VR.</p><span class="go" data-fnop-i18n="control.stayPc">SEGUIR EN PC →</span></button></div></section></main>
<script>
const screen=document.getElementById('screen');
let choosing=false;
function choose(mode){if(choosing)return;choosing=true;window.fnopAction('choose',mode==='vr'?'vr':'desktop');setTimeout(()=>{choosing=false;},900);}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.mode)));
</script></body></html>
