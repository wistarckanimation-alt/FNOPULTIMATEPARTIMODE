<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Shop</title>
<style>
:root{--accent:#ff58b7;--accent2:#9a6cff;--gold:#ffd85e;--green:#64ff9a}.shop-panel{width:min(1320px,97vw);height:min(840px,95vh);display:grid;grid-template-rows:auto auto 1fr auto;contain:layout paint style;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.shop-head-right{display:flex;gap:12px;align-items:center;justify-content:flex-end}.wallet{min-width:225px;padding:13px 18px;border-radius:17px;border:1px solid rgba(255,216,94,.32);background:linear-gradient(135deg,rgba(255,216,94,.15),rgba(255,255,255,.03));box-shadow:0 0 30px rgba(255,216,94,.08)}.wallet small{display:block;font-size:10px;letter-spacing:.18em;color:#ffe995}.wallet b{display:block;font-size:30px;line-height:1.05;color:white}.coin-dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:radial-gradient(circle at 35% 30%,#fff7b3,#ffc928 55%,#c77800);box-shadow:0 0 14px rgba(255,201,40,.45)}.shop-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}.sync{font-size:10px;letter-spacing:.14em;padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.sync.online{color:#8dffb2;border-color:rgba(141,255,178,.3)}.timer{font-weight:900;color:#fff}.shop-body{min-height:0;padding:18px 24px 30px}.news-wrap{margin-bottom:21px}.section-kicker{font-size:10px;letter-spacing:.24em;color:var(--accent);font-weight:900;margin:3px 0 9px}.news-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;perspective:900px}.news-mini{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.025);cursor:pointer;padding:0;text-align:left;color:white;transform-style:preserve-3d;will-change:transform;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;box-shadow:0 12px 28px rgba(0,0,0,.18)}.news-mini:hover{border-color:rgba(255,118,205,.48);box-shadow:0 20px 44px rgba(0,0,0,.32),0 0 28px rgba(255,88,183,.10)}.news-mini img,.news-mini video{width:100%;height:100%;object-fit:cover;pointer-events:none}.news-mini .shade{position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(5,3,9,.94));padding:24px 13px 10px;display:flex;align-items:flex-end;font-weight:900}.category-section{margin:0 0 27px;content-visibility:auto;contain-intrinsic-size:260px}.category-title{display:flex;align-items:center;gap:10px;margin:0 0 11px;font-size:18px;letter-spacing:.04em}.category-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(255,88,183,.35),transparent)}.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.offer{min-height:220px;padding:13px;display:grid;grid-template-columns:170px 1fr;gap:15px;animation:fnopCardIn .14s var(--ease) both}.offer-img{height:170px;border-radius:15px;background:radial-gradient(circle at 50% 35%,rgba(255,79,181,.13),rgba(255,255,255,.02));padding:8px;overflow:hidden;display:grid;place-items:center}.offer h3{font-size:21px;margin:3px 0 6px}.offer .meta{font-size:9px;letter-spacing:.16em;color:var(--cyan);font-weight:850}.offer .price{font-size:19px;font-weight:900;margin-top:9px;color:#fff}.offer .fnop-btn{margin-top:9px;min-height:40px;width:100%}.offer.owned{border-color:rgba(91,255,151,.5);background:linear-gradient(145deg,rgba(44,180,103,.18),rgba(255,255,255,.018));box-shadow:0 18px 44px rgba(44,180,103,.10)}.offer.owned .buy{opacity:1!important;color:#a8ffc5;border-color:rgba(91,255,151,.5);background:rgba(44,180,103,.16)}.offer.patreon-locked .buy{color:#ffe27a;border-color:rgba(255,216,94,.35);background:rgba(255,216,94,.08);opacity:.9}.patreon-only-badge{display:inline-block;margin:0 0 5px;color:#ffd85e;font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 18px rgba(255,216,94,.35);animation:patreonBreath 3s ease-in-out infinite}@keyframes patreonBreath{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.075);opacity:1}}.status{min-height:46px;padding:0 24px 15px;color:var(--muted);font-size:12px}.empty{min-height:180px;border:1px dashed var(--line);border-radius:20px;display:grid;place-items:center;text-align:center;color:var(--muted);letter-spacing:.08em}.editor-note{display:none}.editor .editor-note{display:inline-flex}.modal-layer{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(3,2,7,.88);opacity:0;pointer-events:none;transition:.18s}.modal-layer.open{opacity:1;pointer-events:auto}.news-full{width:min(1060px,92vw);max-height:90vh;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:#0a0710;box-shadow:0 35px 120px rgba(0,0,0,.7);transform-style:preserve-3d;will-change:transform;transition:transform .16s ease}.news-full-media{aspect-ratio:16/9;background:#100b18}.news-full-media img,.news-full-media video{width:100%;height:100%;object-fit:cover;background:#030205}.news-full-copy{padding:20px 24px 25px}.news-full-copy h2{margin:0 0 9px;font-size:31px}.news-full-copy p{color:var(--muted);line-height:1.55}.purchase-stage{position:fixed;inset:0;z-index:100;background:#030205;display:none;place-items:center;overflow:hidden}.purchase-stage.open{display:grid}.purchase-media{position:absolute;inset:0;display:grid;place-items:center}.purchase-media video{width:100%;height:100%;object-fit:cover;contain:strict;background:#030205}.purchase-media canvas{width:100%;height:100%;display:block}.purchase-media img{width:min(620px,70vw);height:min(620px,70vh);object-fit:cover;object-position:center center;box-shadow:0 0 52px rgba(255,88,183,.14);animation:purchasePop .62s cubic-bezier(.15,.8,.2,1.15) both}.purchase-particles{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,88,183,.18),transparent 35%),radial-gradient(circle at 25% 30%,rgba(255,216,94,.18),transparent 3%),radial-gradient(circle at 70% 24%,rgba(154,108,255,.2),transparent 3%);opacity:.72;animation:purchaseGlow 1.25s ease-in-out infinite alternate;pointer-events:none}.purchase-copy{position:absolute;left:0;right:0;bottom:0;padding:80px 8vw 6vh;background:linear-gradient(transparent,rgba(3,2,5,.97) 45%);text-align:center;opacity:0;transform:translateY(20px);transition:.35s}.purchase-stage.reveal .purchase-copy{opacity:1;transform:none}.purchase-copy h2{font-size:clamp(32px,5vw,68px);margin:0}.purchase-copy p{max-width:760px;margin:12px auto 18px;color:#d8d0e4;line-height:1.55}.purchase-copy .fnop-btn{min-width:220px}.purchase-shake{animation:purchaseShake .48s ease!important}@keyframes purchaseShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}@keyframes purchasePop{0%{opacity:0;transform:scale(.45) rotate(-5deg)}65%{opacity:1;transform:scale(1.07) rotate(1deg)}100%{transform:scale(1)}}@keyframes purchaseGlow{from{opacity:.48;transform:scale(1)}to{opacity:.86;transform:scale(1.018)}}@media(max-width:950px){.offer{grid-template-columns:140px 1fr}.offer-img{height:140px}.news-strip{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.offers{grid-template-columns:1fr}.offer{grid-template-columns:120px 1fr}.offer-img{height:120px}.news-strip{grid-template-columns:1fr}.shop-body{padding:14px}}
.dev-toggle{display:none;border-color:rgba(96,255,196,.4)!important;color:#9dffd7!important;background:rgba(35,170,110,.10)!important}.dev-toggle.show{display:inline-flex}.dev-panel{display:none;margin:0 0 18px;padding:16px;border:1px solid rgba(96,255,196,.28);border-radius:18px;background:linear-gradient(135deg,rgba(30,150,100,.12),rgba(154,108,255,.06))}.dev-panel.open{display:block}.dev-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.dev-title b{color:#9dffd7;letter-spacing:.12em}.dev-title small{color:var(--muted)}.dev-actions{display:flex;gap:9px;flex-wrap:wrap}.dev-actions .fnop-btn{min-height:38px}.chest-inventory{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}.chest-inventory-card{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.chest-inventory-visual{width:56px;height:56px;border-radius:12px;display:grid;place-items:center}.chest-inventory-card img{width:56px;height:56px;object-fit:cover;object-position:center center}.chest-inventory-card b{font-size:13px}.chest-inventory-card span{display:block;color:var(--gold);font-weight:900;margin-top:3px}@media(max-width:900px){.chest-inventory{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fnop-reward-visual img,.fnop-reward-visual .fnop-img{display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;object-fit:cover!important;object-position:center center!important;}
</style></head><body><main class="fnop-screen"><section class="fnop-panel shop-panel"><header class="fnop-head"><div><div class="fnop-kicker">LIVE OPS // GLOBAL STORE</div><h1 class="fnop-title">TIENDA FNOP</h1></div><div class="shop-head-right"><button type="button" class="fnop-btn dev-toggle" id="devToggle">🛠 <span id="devToggleLabel" data-fnop-i18n="dev.mode">MODO DESARROLLADOR</span></button><button class="fnop-btn" id="patreon">CONECTAR PATREON</button><div class="wallet"><small id="coinsLabel">TUS MONEDAS</small><b><span class="coin-dot"></span><span id="coins">0</span></b></div></div></header><div class="shop-toolbar"><span class="sync" id="sync">LOCAL / SIN CDN</span><span class="sync"><span id="nextLabel">SIGUIENTE CAMBIO</span> <b class="timer" id="timer">--</b></span><span class="sync editor-note">PREVIEW DEL EDITOR</span></div><div class="shop-body fnop-scroll"><section class="dev-panel" id="devPanel"><div class="dev-title"><div><b id="devTitle" data-fnop-i18n="dev.mode">MODO DESARROLLADOR</b><br><small id="devOnly" data-fnop-i18n="dev.editorOnly">SOLO DISPONIBLE DESDE UNREAL EDITOR</small></div></div><div class="dev-actions"><label for="devAmount" data-fnop-i18n="dev.coinAmount">Cantidad de monedas</label><input id="devAmount" type="number" min="1" max="1000000" step="1" value="1000"><button class="fnop-btn" id="devCoinsCustom" data-fnop-i18n="dev.addCoins">AÑADIR MONEDAS</button><button class="fnop-btn" id="devCoins1">+1.000</button><button class="fnop-btn" id="devCoins10">+10.000</button><button class="fnop-btn" id="devSpins" data-fnop-i18n="dev.addSpins">AÑADIR TIRADAS +10</button><button class="fnop-btn" id="devChests" data-fnop-i18n="dev.addChests">AÑADIR COFRES DE PRUEBA</button><button class="fnop-btn" id="devReset" data-fnop-i18n="dev.reset">REINICIAR PROGRESO LOCAL</button></div></section><div class="news-wrap" id="inventoryChestWrap" hidden><div class="section-kicker" id="inventoryChestLabel">TUS COFRES</div><div class="chest-inventory" id="inventoryChests"></div></div><div class="news-wrap" id="newsWrap" hidden><div class="section-kicker" id="newsLabel">NOVEDADES</div><div class="news-strip" id="news"></div></div><div id="sections"></div></div><div class="status" id="status"></div></section></main>
<div class="modal-layer" id="newsModal"><div class="news-full"><div class="news-full-media" id="newsFullMedia"></div><div class="news-full-copy"><h2 id="newsFullTitle"></h2><p id="newsFullText"></p><button class="fnop-btn" id="newsClose">CERRAR</button></div></div></div>
<div class="purchase-stage" id="purchaseStage"><div class="purchase-particles"></div><div class="purchase-media" id="purchaseMedia"></div><div class="purchase-copy"><div class="fnop-kicker" id="acquiredLabel">ADQUIRIDO</div><h2 id="purchaseTitle"></h2><p id="purchaseDescription"></p><button class="fnop-btn primary" id="purchaseAccept">ACEPTAR</button></div></div>
<script>
const q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let nextUtc='',lastState={offers:[],news:[]};let activeShopVideo=null;function shopMediaFocus(on){window.fnopAction?.('__media_focus',on?'1':'0')}function releaseShopVideo(v){if(v&&activeShopVideo===v)activeShopVideo=null;shopMediaFocus(false)}function stopShopVideo(){const v=activeShopVideo;activeShopVideo=null;if(v){try{v.pause()}catch(e){}}shopMediaFocus(false)}function bindNewsTilt(el,strength=6){if(!el||el.dataset.tiltBound)return;el.dataset.tiltBound='1';el.dataset.tiltStrength=String(strength);el.addEventListener('pointermove',e=>{if(el.dataset.tiltActive==='0')return;const r=el.getBoundingClientRect();if(!r.width||!r.height)return;const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,s=Number(el.dataset.tiltStrength||strength);el.style.transform=`perspective(900px) rotateX(${(-y*s).toFixed(2)}deg) rotateY(${(x*s).toFixed(2)}deg) translateY(-2px) scale(1.012)`});const reset=()=>{el.style.transform=''};el.addEventListener('pointerleave',reset);el.addEventListener('pointercancel',reset)}function image(src){return src?`<img class="fnop-img" src="${esc(src)}" loading="lazy" decoding="async" alt="">`:`<div class="fnop-empty">${esc(lastState.labelNoImage||'SIN IMAGEN')}</div>`}function updateTimer(){const el=q('#timer');if(!el)return;if(!nextUtc){el.textContent=lastState.labelLocalRotation||'ROTACION LOCAL';return;}const ms=new Date(nextUtc).getTime()-Date.now();if(ms<=0){el.textContent=lastState.labelUpdating||'ACTUALIZANDO...';return;}const sec=Math.floor(ms/1000),d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;el.textContent=`${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function renderNews(d){const list=Array.isArray(d.news)?d.news:[],wrap=q('#newsWrap'),root=q('#news');q('#newsLabel').textContent=d.labelNews||'NOVEDADES';root.innerHTML='';wrap.hidden=!list.length;list.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='news-mini';b.dataset.shopNews=n.id;const visual=n.image?`<img src="${esc(n.image)}" loading="lazy" decoding="async" alt="">`:(n.video?`<video src="${esc(n.video)}" muted playsinline preload="metadata"></video>`:'');b.innerHTML=`${visual}<div class="shade">${esc(n.title||'NOVEDAD')}</div>`;b.onclick=()=>fnopShowNews(n.id);root.appendChild(b);bindNewsTilt(b,6)})}
window.fnopShowNews=id=>{const n=(lastState.news||[]).find(x=>String(x.id)===String(id));if(!n)return;stopShopVideo();const host=q('#newsFullMedia'),panel=q('#newsModal .news-full');host.replaceChildren();if(n.video){const v=document.createElement('video');v.src=n.video;v.autoplay=true;v.playsInline=true;v.controls=true;v.preload='auto';v.disablePictureInPicture=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');host.appendChild(v);activeShopVideo=v;v.addEventListener('playing',()=>shopMediaFocus(true),{once:true});v.addEventListener('ended',()=>releaseShopVideo(v),{once:true});v.addEventListener('error',()=>releaseShopVideo(v),{once:true});const p=v.play();if(p&&p.catch)p.catch(()=>releaseShopVideo(v));if(panel){panel.dataset.tiltActive='0';panel.style.transform=''}}else if(n.image){const im=new Image();im.alt='';im.decoding='async';im.src=n.image;host.appendChild(im);if(panel){panel.dataset.tiltActive='1';bindNewsTilt(panel,3.2)}}else if(panel){panel.dataset.tiltActive='0';panel.style.transform=''}q('#newsFullTitle').textContent=n.title||'';q('#newsFullText').textContent=n.description||'';q('#newsModal').classList.add('open')};
function renderInventoryChests(d){const list=Array.isArray(d.inventoryChests)?d.inventoryChests:[],wrap=q('#inventoryChestWrap'),root=q('#inventoryChests');if(!wrap||!root)return;wrap.hidden=!list.length;root.innerHTML='';q('#inventoryChestLabel').textContent=d.labelYourChests||'TUS COFRES';list.forEach(c=>{const card=document.createElement('div');card.className='chest-inventory-card';const count=Number(c.count||0);card.innerHTML=`<div class="fnop-reward-visual chest-inventory-visual" data-fnop-reward-visual="1" data-fnop-accent="${esc(c.accent||'#ff55b9')}">${c.image?`<img src="${esc(c.image)}" alt="">`:'<div class="fnop-empty">◇</div>'}</div><div><b>${esc(c.name||c.category)}</b><span>× ${count}</span><button class="fnop-btn chest-open" ${count<=0?'disabled':''}>${esc(d.labelOpenChest||'ABRIR COFRE')}</button></div>`;window.FNOPRewardVisuals?.decorate(card.querySelector('.chest-inventory-visual'),c.accent||'#ff55b9');const b=card.querySelector('.chest-open');if(b&&count>0)b.onclick=()=>window.fnopAction?.('openchest',c.category||'common');root.appendChild(card)})}
function renderOffers(d){const root=q('#sections');root.innerHTML='';const offers=Array.isArray(d.offers)?d.offers:[],cats=Array.isArray(d.categories)&&d.categories.length?d.categories:[{id:'other',name:'TIENDA'}];if(!offers.length){root.innerHTML=`<div class="empty"><div><b>${esc(d.labelEmptyShop||'TIENDA VACIA')}</b><br><br>${esc(d.labelAddProductsEditor||'Añade productos desde el Editor de Tienda.')}</div></div>`;return}cats.sort((a,b)=>(a.order||0)-(b.order||0)).forEach(c=>{const items=offers.filter(o=>String(o.category||'other')===String(c.id));if(!items.length)return;const sec=document.createElement('section');sec.className='category-section';sec.innerHTML=`<h2 class="category-title">${esc(c.name||c.id)}</h2><div class="offers"></div>`;const grid=sec.querySelector('.offers');items.forEach((o,i)=>{const card=document.createElement('article');card.dataset.offerId=o.id;card.className='fnop-card offer'+(o.owned?' owned':'')+(o.patreon?' patreon-only':'')+(o.patreonLocked?' patreon-locked':'');card.style.animationDelay=(i*.018)+'s';const badge=o.patreon?`<div class="patreon-only-badge">${esc(d.labelPatreonOnly||'ONLY IN PATREON')}</div>`:'';const price=Number(o.price||0)===0?(d.labelFree||'GRATIS'):`${Number(o.price||0).toLocaleString()} ${d.labelCoins||'MONEDAS'}`;let label=d.previewOnly?(d.labelPreview||'PREVIEW'):o.owned?(d.labelOwned||'OBTENIDO'):o.patreonLocked?(d.labelPatreonLocked||'REQUIERE PATREON'):(d.labelBuy||'COMPRAR');const disabled=!!d.previewOnly||o.owned||o.patreonLocked;card.innerHTML=`<div class="offer-img fnop-reward-visual" data-fnop-reward-visual="1" data-fnop-accent="${esc(o.accent||'#ff55b9')}">${image(o.image)}</div><div>${badge}<div class="meta">${esc(o.type==='chest'?(d.labelChest||'COFRE'):(o.type==='mood'?'MOOD':(o.type==='spins'?'TIRADAS':(d.labelStoreGlobal||'TIENDA GLOBAL'))))}${o.repeatable?' · ∞':''}</div><h3>${esc(o.name||o.id)}</h3><div class="price">${esc(price)}</div><button type="button" class="fnop-btn primary buy" data-fnop-buy="${esc(o.id)}" ${disabled?'disabled':''}>${esc(label)}</button></div>`;const b=card.querySelector('.buy');if(!disabled)b.onclick=()=>window.fnopAction?.('buy',o.id);window.FNOPRewardVisuals?.decorate(card.querySelector('.offer-img'),o.accent||'#ff55b9');grid.appendChild(card)});root.appendChild(sec)})}
window.fnopSetShop=d=>{if(!d)return;lastState=d;window.__FNOP_LAST_SHOP_STATE__=d;document.body.classList.toggle('editor',!!d.previewOnly);const available=!!d.developerModeAvailable,dev=q('#devToggle'),devPanel=q('#devPanel');if(!available){dev?.remove();devPanel?.remove()}else{dev?.classList.add('show');if(dev)dev.hidden=false;const set=(id,t)=>{const e=q(id);if(e)e.textContent=t};set('#devToggleLabel',d.labelDeveloperMode||'MODO DESARROLLADOR');set('#devTitle',d.labelDeveloperMode||'MODO DESARROLLADOR');set('#devOnly',d.labelDeveloperOnlyEditor||'SOLO DISPONIBLE DESDE UNREAL EDITOR');set('#devCoins1',(d.labelDevAddCoins||'AÑADIR MONEDAS')+' +1.000');set('#devCoins10',(d.labelDevAddCoins||'AÑADIR MONEDAS')+' +10.000');set('#devSpins',(d.labelDevAddSpins||'AÑADIR TIRADAS')+' +10');set('#devChests',d.labelDevAddChests||'AÑADIR COFRES DE PRUEBA');set('#devReset',d.labelDevResetSave||'REINICIAR PROGRESO LOCAL')}q('#coins').textContent=Number(d.coins??0).toLocaleString();q('#coinsLabel').textContent=d.labelYourCoins||'TUS MONEDAS';q('#nextLabel').textContent=d.labelNextChange||'SIGUIENTE CAMBIO';q('#patreon').textContent=d.patreon?(d.labelPatreonConnected||'PATREON CONECTADO'):(d.labelConnectPatreon||'CONECTAR PATREON');q('#newsClose').textContent=d.labelClose||'CERRAR';q('#acquiredLabel').textContent=d.labelAcquired||'ADQUIRIDO';q('#status').textContent=d.status||'';q('#purchaseAccept').textContent=d.labelAccept||'ACEPTAR';nextUtc=d.nextRefreshUtc||'';const sync=q('#sync');sync.textContent=d.synced?(d.labelSynced||'SYNCED')+' · '+(d.rotationId||'LIVE'):(d.localPublished?(d.labelLocalPublished||'LOCAL PUBLISHED')+' · '+(d.rotationId||'LIVE'):(d.labelLocalNoCdn||'LOCAL / NO CDN'));sync.classList.toggle('online',!!d.synced);renderInventoryChests(d);renderNews(d);renderOffers(d);updateTimer()};
window.fnopShowPurchaseById=id=>{const o=(lastState.offers||[]).find(x=>String(x.id)===String(id));if(!o)return;const card=[...document.querySelectorAll('[data-offer-id]')].find(x=>String(x.dataset.offerId)===String(id));if(card){try{card.getAnimations?.().forEach(a=>a.cancel());card.animate([{transform:'translateX(0)'},{transform:'translateX(-9px) rotate(-1deg)'},{transform:'translateX(8px) rotate(1deg)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:440,easing:'ease-out'})}catch(e){card.classList.add('purchase-shake');setTimeout(()=>card.classList.remove('purchase-shake'),500)}}stopShopVideo();const st=q('#purchaseStage'),media=q('#purchaseMedia');st.classList.remove('reveal');media.replaceChildren();q('#purchaseTitle').textContent=o.presentationTitle||o.name||o.id;q('#purchaseDescription').textContent=o.description||'';st.classList.add('open');let shown=false;const reveal=()=>{if(shown)return;shown=true;st.classList.add('reveal')};if(o.cinematic&&o.video){const v=document.createElement('video');v.src=o.video;v.autoplay=true;v.playsInline=true;v.controls=false;v.preload='auto';v.disablePictureInPicture=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.setAttribute('disableremoteplayback','');activeShopVideo=v;v.addEventListener('playing',()=>shopMediaFocus(true),{once:true});const freeze=()=>{releaseShopVideo(v);try{v.pause();if(v.videoWidth>0&&v.videoHeight>0){const r=media.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,1.5),c=document.createElement('canvas');c.width=Math.max(2,Math.round(r.width*dpr));c.height=Math.max(2,Math.round(r.height*dpr));const x=c.getContext('2d',{alpha:false});if(x){const sc=Math.max(c.width/v.videoWidth,c.height/v.videoHeight),dw=v.videoWidth*sc,dh=v.videoHeight*sc;x.drawImage(v,(c.width-dw)*.5,(c.height-dh)*.5,dw,dh);c.setAttribute('aria-hidden','true');media.replaceChildren(c);reveal();return}}const d=v.duration;if(Number.isFinite(d)&&d>.03){const target=Math.max(0,d-Math.min(.034,Math.max(1/120,d*.002)));let done=false;const finish=()=>{if(done)return;done=true;reveal()};v.addEventListener('seeked',finish,{once:true});v.currentTime=target;setTimeout(finish,140);return}}catch(e){}reveal()};v.addEventListener('ended',freeze,{once:true});v.addEventListener('error',()=>{releaseShopVideo(v);reveal()},{once:true});media.appendChild(v);const play=v.play();if(play&&play.catch)play.catch(()=>{releaseShopVideo(v);reveal()})}else{if(o.image){const im=new Image();im.alt='';im.decoding='async';im.src=o.image;media.appendChild(im)}setTimeout(reveal,520)}};
