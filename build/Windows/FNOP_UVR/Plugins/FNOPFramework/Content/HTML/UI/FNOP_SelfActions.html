<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}.panel{width:100%;height:100%;box-sizing:border-box;padding:34px 42px;background:linear-gradient(145deg,rgba(7,10,17,.96),rgba(13,20,31,.94));border:2px solid rgba(100,210,255,.32);border-radius:26px}.top{display:flex;align-items:center;justify-content:space-between}.title{font-size:34px;font-weight:900}.sub{font-size:18px;opacity:.68;margin-top:7px}.close{font-size:28px;width:52px;height:52px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:#fff}.grid{margin-top:26px;height:calc(100% - 110px);overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}.card{min-height:104px;padding:16px;border-radius:18px;border:1px solid rgba(160,210,240,.26);background:rgba(20,30,44,.88);color:#fff;font-size:20px;font-weight:750;text-align:left}.card:hover{border-color:#ffe66b;box-shadow:0 0 20px rgba(255,230,107,.28);background:rgba(40,42,31,.94)}.empty{grid-column:1/-1;padding:40px;text-align:center;opacity:.65;font-size:22px}</style></head><body><div class="panel"><div class="top"><div><div class="title" id="title">¿QUIERES HACER UNA ACCIÓN?</div><div class="sub" id="sub">Solo aparecen acciones y variantes que tienes desbloqueadas.</div></div><button class="close" onclick="send('self_close','')">×</button></div><div class="grid" id="grid"></div></div><script>
function send(a,p=''){p=String(p||'');try{if(typeof window.fnopAction==='function'){window.fnopAction(a,p);return}}catch(e){}const msg='__FNOP_ACTION__'+encodeURIComponent(a)+'|'+encodeURIComponent(p);try{console.log(msg)}catch(e){}try{document.title=msg}catch(e){}}
const D={es:['¿QUIERES HACER UNA ACCIÓN?','Solo aparecen acciones y variantes que tienes desbloqueadas.','No hay acciones disponibles.'],en:['DO YOU WANT TO PERFORM AN ACTION?','Only your unlocked actions and variants are shown.','No actions available.'],fr:['VOULEZ-VOUS FAIRE UNE ACTION ?','Seules vos actions et variantes débloquées sont affichées.','Aucune action disponible.'],de:['MÖCHTEST DU EINE AKTION AUSFÜHREN?','Nur freigeschaltete Aktionen und Varianten werden angezeigt.','Keine Aktionen verfügbar.'],it:['VUOI ESEGUIRE UN’AZIONE?','Sono mostrate solo le azioni e varianti sbloccate.','Nessuna azione disponibile.'],pt:['QUER FAZER UMA AÇÃO?','Só aparecem ações e variantes desbloqueadas.','Nenhuma ação disponível.'],ja:['アクションを実行しますか？','解除済みのアクションとバリエーションのみ表示します。','利用できるアクションはありません。'],ko:['액션을 실행할까요?','잠금 해제한 액션과 변형만 표시됩니다.','사용 가능한 액션이 없습니다.'],ru:['ВЫПОЛНИТЬ ДЕЙСТВИЕ?','Показаны только разблокированные действия и варианты.','Нет доступных действий.'],pl:['WYKONAĆ AKCJĘ?','Wyświetlane są tylko odblokowane akcje i warianty.','Brak dostępnych akcji.'],zhHans:['要执行动作吗？','仅显示已解锁的动作和变体。','没有可用动作。'],zhHant:['要執行動作嗎？','僅顯示已解鎖的動作和變體。','沒有可用動作。']};let l=(navigator.language||'es').toLowerCase(),t=l.startsWith('en')?D.en:l.startsWith('fr')?D.fr:l.startsWith('de')?D.de:l.startsWith('it')?D.it:l.startsWith('pt')?D.pt:l.startsWith('ja')?D.ja:l.startsWith('ko')?D.ko:l.startsWith('ru')?D.ru:l.startsWith('pl')?D.pl:(l.startsWith('zh-hant')||l.startsWith('zh-tw')||l.startsWith('zh-hk'))?D.zhHant:l.startsWith('zh')?D.zhHans:D.es;title.textContent=t[0];sub.textContent=t[1];
window.fnopSetSelfActions=function(s){grid.innerHTML='';const a=s.actions||[];if(!a.length){const e=document.createElement('div');e.className='empty';e.textContent=t[2];grid.appendChild(e);return;}a.forEach(x=>{const b=document.createElement('button');b.className='card';b.textContent=x.name||x.action;b.onclick=()=>send('self_action',(x.action||'')+'||'+(x.variant||''));grid.appendChild(b);});};
</script></body></html>
