<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNOP Minigame</title><style>
body{position:relative;overflow:hidden}.generic{position:absolute;left:0;top:0;width:520px;padding:18px 22px;border:1px solid var(--line);border-radius:20px;background:rgba(12,9,18,.66);min-width:0;max-width:none}.generic h2{margin:3px 0;font-size:25px}.desc{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.4}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{font-size:9px;font-weight:850;padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.06);color:#cfe0f2}.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}.clock{font-size:27px;font-weight:950;font-variant-numeric:tabular-nums}.progress{font-size:13px;font-weight:900}.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .08s linear}.status{margin-top:9px;color:var(--muted);font-size:10px;font-weight:800}.item-objective{position:absolute;left:550px;right:auto;top:0;width:270px;padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(12,9,18,.78);backdrop-filter:blur(10px);display:none;gap:10px;align-items:center}.item-objective.show{display:flex}.item-objective.near{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 28px rgba(103,213,255,.18)}.item-icon{width:48px;height:48px;object-fit:contain;border-radius:10px;background:rgba(255,255,255,.05);display:none}.item-icon.show{display:block}.item-copy{min-width:0;flex:1}.item-name{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-count{font-size:18px;font-weight:950;margin-top:2px}.item-hint{font-size:9px;line-height:1.3;color:var(--muted);font-weight:800;margin-top:3px}
</style>
<style id="fnop-final4-polish">
/* FNOP 1.33.0: lectura y control reforzados para pantallas 3D, raton y puntero VR. */
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,.fnop-btn{min-height:46px;touch-action:manipulation;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease,opacity .12s ease}button:not(:disabled):hover,.fnop-btn:not(:disabled):hover{filter:brightness(1.08)}button:not(:disabled):active,.fnop-btn:not(:disabled):active{transform:translateY(1px) scale(.985)}button:focus-visible,.fnop-btn:focus-visible{outline:3px solid rgba(255,255,255,.92);outline-offset:3px}.app,.p-shell,.generic,.battery-ui,.order,.hub,.result{isolation:isolate}.stage,.stage-wrap,.games,.rewards{box-shadow:inset 0 0 0 1px rgba(255,255,255,.055),0 16px 42px rgba(0,0,0,.22)}.chip,.status,.timer,.clock{backdrop-filter:blur(7px)}@media (pointer:coarse){button,.fnop-btn{min-height:54px;min-width:54px}.chip{padding-block:8px}}@media (max-width:900px){.top,.p-head,.order-head,.hub-head{gap:10px}.desc,.game-desc,.hint{line-height:1.35}}
</style>
</head><body><section class="generic"><div class="fnop-kicker">FNOP · CHALLENGE</div><h2 id="title" data-fnop-i18n="challenge.minigame">MINIGAME</h2><div class="desc" id="description"></div><div class="meta" id="meta"></div><div class="row"><div class="progress" id="progressText"></div><div class="clock" id="time">0:00</div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status"></div></section><aside id="itemObjective" class="item-objective"><img id="itemIcon" class="item-icon"><div class="item-copy"><div id="itemName" class="item-name"></div><div id="itemCount" class="item-count"></div><div id="itemHint" class="item-hint"></div></div></aside><script>function fnopScoreBadge(d,host){var badge=document.getElementById('moodRoundScore');if(!badge){badge=document.createElement('div');badge.id='moodRoundScore';badge.className='mood-round-score';host.appendChild(badge);}badge.textContent=(d.scoreLabel||(window.FNOPI18n?.t('challenge.score','Score')||'Score'))+': '+String(d.score||0)+(d.hard?' \u00b7 '+(d.hardLabel||(window.FNOPI18n?.t('challenge.hard','Hard: score and rewards x2')||'Hard: score and rewards x2')):'');badge.classList.toggle('hard',!!d.hard);} 
const q=s=>document.querySelector(s);function fmt(v){v=Math.max(0,Math.ceil(v||0));return `${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`}function num(v){const x=Number(v||0);return Number.isInteger(x)?String(x):x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}function setMinigame(d){d=d||{};fnopScoreBadge(d,document.querySelector('.fnop-panel')||document.body);q('#title').textContent=d.title||d.minigameName||'MINIGAME';q('#description').textContent=d.description||d.minigameDescription||'';q('#time').textContent=d.unlimited?'∞':fmt(d.time);q('#progressText').textContent=(Number.isFinite(d.correct)&&Number.isFinite(d.goal)&&d.goal>0)?`${d.correct} / ${d.goal}`:'';q('#fill').style.width=`${Math.max(0,Math.min(1,d.progress||0))*100}%`;q('#status').textContent=d.status||d.minigameObjective||'';const item=q('#itemObjective');if(item){item.classList.toggle('show',!!d.itemObjectiveVisible);item.classList.toggle('near',!!d.nearReceiver);q('#itemName').textContent=d.itemName||d.itemGroup||'';q('#itemCount').textContent=(Number.isFinite(d.itemProgress)&&Number.isFinite(d.itemGoal)&&d.itemGoal>0)?`${d.itemProgress} / ${d.itemGoal}`:'';q('#itemHint').textContent=d.itemHint||'';const icon=q('#itemIcon');if(icon){if(d.itemImage){icon.src=d.itemImage;icon.classList.add('show')}else{icon.removeAttribute('src');icon.classList.remove('show')}}}const meta=[];meta.push(d.unlimited?'⏱ SIN LIMITE':`⏱ ${num(d.minigameDurationMinutes||Number(d.duration||0)/60)} MIN`);if(d.minigameObjective)meta.push(`◎ ${d.minigameObjective}`);if(d.minigameCoins||d.minigameSpins||d.minigameChests)meta.push(`🪙 ${d.minigameCoins||0} · 🎟️ ${d.minigameSpins||0} · ▣ ${d.minigameChests||0}`);q('#meta').innerHTML=meta.map(()=>'<span class="chip"></span>').join('');[...q('#meta').children].forEach((el,i)=>el.textContent=meta[i])}window.fnopSetMinigame=setMinigame;window.fnopSetChallenge=setMinigame;
</script></body></html>
